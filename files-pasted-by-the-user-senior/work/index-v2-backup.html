<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="YouTrube — видео, Shorts, идеи и ваши истории.">
<title>YouTrube — видео и идеи</title>
<style>
:root{--bg:#fff;--surface:#f5f5f5;--surface-hover:#eaeaea;--text-primary:#111;--text-secondary:#666;--border:#e5e5e5;--accent:#e62737;--blue:#065fd4;--sidebar-width:216px;--header-height:64px;--panel:#fff;--shadow:0 8px 40px #0002;--chart:#2389d7;--radius:12px}

[data-theme=dark]{--bg:#0f0f0f;--surface:#222;--surface-hover:#333;--text-primary:#f1f1f1;--text-secondary:#aaa;--border:#303030;--accent:#ff4757;--blue:#7db5ff;--panel:#191919;--shadow:0 8px 40px #0007;--chart:#56b8ff}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer;color:inherit}
button:disabled{cursor:wait;opacity:.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;object-fit:cover}
button{border:0;background:none}
svg{display:block}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,a{transition:background .16s,color .16s,transform .16s}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1{font-size:27px;letter-spacing:-.6px;line-height:1.3}
h2{font-size:21px;letter-spacing:-.35px}
h3{font-size:16px}
.muted{color:var(--text-secondary)}
.tiny{font-size:12px}
.nowrap{white-space:nowrap}
.divider{border:0;border-top:1px solid var(--border);margin:16px 0}
.icon-btn{height:40px;width:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.icon-btn:hover{background:var(--surface-hover)}
.btn{min-height:38px;padding:9px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:24px;background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-hover)}
.btn.primary{background:var(--text-primary);color:var(--bg)}
.btn.blue{background:var(--blue);color:var(--bg)}
.btn.outline{border:1px solid var(--border);background:transparent}
.btn.danger{color:var(--accent)}
.btn .icon{width:19px;height:19px}
.btn.selected{background:var(--surface-hover);color:var(--blue)}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.gap8{gap:8px}
.stack{display:grid;gap:18px}
.avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:#b6c9c1;color:#173b30;font-weight:700;overflow:hidden}
.avatar img{height:100%;width:100%}
.avatar.large{width:120px;height:120px;font-size:40px}
.avatar.medium{width:64px;height:64px;font-size:23px}
.avatar.small{height:30px;width:30px;font-size:11px}
.header{position:fixed;inset:0 0 auto;height:var(--header-height);background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 16px;gap:24px}
.brand{display:flex;align-items:center;gap:8px;font-size:25px;letter-spacing:-1px;font-weight:800;white-space:nowrap}
.brandmark{width:31px;height:24px;background:var(--accent);border-radius:8px;transform:skew(-7deg);display:grid;place-items:center}
.brandmark:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px;transform:skew(7deg)}
.brand small{font-size:12px;letter-spacing:0;font-weight:500;color:var(--text-secondary);align-self:flex-end;margin:0 0 5px 2px}
.header-left{display:flex;align-items:center;gap:12px;min-width:192px}
.search{display:flex;max-width:640px;flex:1;height:40px}
.search input{width:100%;min-width:0;border:1px solid var(--border);border-radius:24px 0 0 24px;background:var(--bg);color:var(--text-primary);padding:0 20px;font-size:16px;box-shadow:inset 0 1px 2px #00000005}
.search button{width:62px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-left:0;border-radius:0 24px 24px 0;display:grid;place-items:center}
.search button:hover{background:var(--surface-hover)}
.header-actions{display:flex;align-items:center;gap:10px}
.profile-btn{padding:0;margin-left:6px}
.profile-btn .avatar{width:33px;height:33px}
.create-top{padding-right:16px}
.sidebar{position:fixed;top:var(--header-height);left:0;bottom:0;width:var(--sidebar-width);padding:10px 12px 24px;overflow-y:auto;background:var(--bg);z-index:20;scrollbar-width:thin}
.sidebar-item{height:43px;border-radius:10px;display:flex;align-items:center;gap:22px;padding:0 12px;margin:2px 0;white-space:nowrap}
.sidebar-item:hover{background:var(--surface)}
.sidebar-item.active{background:var(--surface);font-weight:600}
.sidebar-item.active .icon{stroke-width:2.25}
.sidebar-label{padding:12px;font-size:13px;font-weight:600}
.sidebar-foot{padding:12px;font-size:11px;line-height:1.8;color:var(--text-secondary)}
.sidebar-channel{padding:18px 0;text-align:center}
.sidebar-channel .avatar{margin:0 auto 12px}
.sidebar-channel h3{overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.compact{--sidebar-width:76px}
.compact .sidebar-item{height:70px;flex-direction:column;gap:5px;padding:12px 0;font-size:10px}
.compact .sidebar-label,.compact .sidebar-foot,.compact .sidebar .divider,.compact .sidebar-channel,.compact .subscription-links{display:none}
.content{margin-left:var(--sidebar-width);padding:88px 32px 40px;min-height:100vh;max-width:2200px}
.chips{position:sticky;top:64px;padding:12px 0 20px;background:var(--bg);z-index:10;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:-24px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:8px;padding:7px 13px;background:var(--surface);white-space:nowrap;font-weight:600}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--text-primary);color:var(--bg)}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 18px}
.video-card{min-width:0;position:relative}
.thumb-link{display:block;position:relative;overflow:hidden;border-radius:12px;background:var(--surface);aspect-ratio:16/9}
.thumbnail{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.thumb-link:hover .thumbnail{transform:scale(1.035)}
.thumb-link:after{content:"▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:45px;height:45px;display:grid;place-items:center;border-radius:50%;background:#0007;color:white;opacity:0;transition:opacity .2s}
.thumb-link:hover:after{opacity:1}
.duration{position:absolute;bottom:8px;right:8px;padding:1px 5px;font-size:12px;font-weight:600;background:#000b;color:#fff;border-radius:4px}
.fresh{position:absolute;top:9px;left:9px;font-size:10px;text-transform:uppercase;letter-spacing:1px;background:#fff;color:#111;padding:4px 7px;border-radius:4px;font-weight:700}
.card-info{display:flex;align-items:flex-start;gap:11px;padding-top:11px}
.card-copy{min-width:0;flex:1}
.card-title{font-weight:600;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 5px}
.card-meta{font-size:12px;line-height:1.6;color:var(--text-secondary)}
.card-meta a:hover{color:var(--text-primary)}
.card-more{width:26px;height:30px;margin-right:-6px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-copy{margin-bottom:24px;max-width:720px}
.page-copy p{margin-top:8px;color:var(--text-secondary)}
.bottom-nav{display:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;gap:12px;min-height:290px}
.empty-symbol{background:var(--surface);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px}
.empty-symbol .icon{height:36px;width:36px}
.empty p{color:var(--text-secondary);max-width:400px}
.channel-banner{height:190px;width:100%;border-radius:14px;object-fit:cover;margin-bottom:26px}
.channel-head{display:flex;gap:24px;align-items:center;margin:0 0 28px}
.channel-copy{min-width:0;overflow-wrap:anywhere}
.channel-copy h1{font-size:34px;margin-bottom:8px}
.channel-copy p{margin:9px 0;max-width:800px;white-space:pre-wrap;overflow-wrap:anywhere}
.channel-head .row{margin-top:14px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:26px;overflow:auto}
.tab{padding:11px 0 13px;white-space:nowrap;color:var(--text-secondary);font-size:15px;font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:var(--text-primary);border-bottom-color:var(--text-primary)}
.about-panel{max-width:780px}
.about-panel p{white-space:pre-wrap;overflow-wrap:anywhere}
.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.watch-main{min-width:0}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;color:#fff}
.player>img{width:100%;height:100%;opacity:.85}
.player.playing>img{animation:slowpan 24s ease-in-out infinite alternate;opacity:.92}
.player-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0008;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;backdrop-filter:blur(3px)}
.player-center .icon{width:30px;height:30px;fill:#fff;stroke:#fff}
.playing .player-center{opacity:0}
.playing:hover .player-center,.playing:focus-within .player-center{opacity:1}
.player-caption{position:absolute;left:24px;top:20px;font-size:11px;letter-spacing:2px;opacity:.7}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:28px 12px 7px;background:linear-gradient(transparent,#000b)}
.player-controls input[type=range]{accent-color:var(--accent);height:4px;width:100%;cursor:pointer;margin:0}
.player-control-row{display:flex;align-items:center;gap:5px;font-size:12px}
.player-control-row .icon-btn{height:32px;width:32px}
.player-control-row .time{margin-left:4px;flex:1}
.player-control-row input.volume{width:56px;margin-left:3px}
.watch-title{font-size:22px;font-weight:700;line-height:1.35;margin:16px 0 13px;overflow-wrap:anywhere}
.watch-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.channel-byline{display:flex;gap:11px;align-items:center}
.channel-byline .btn{margin-left:9px}
.channel-byline h3{font-size:14px}
.reactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reaction-group{display:flex;background:var(--surface);border-radius:24px;overflow:hidden}
.reaction-group .btn{background:none;border-radius:0}
.reaction-group .btn+button{border-left:1px solid var(--border);padding:8px 12px}
.description{background:var(--surface);border-radius:12px;padding:14px;margin-top:18px}
.description p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:9px}
.description:not(.expanded) p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.text-btn{font-weight:600;padding:10px 0 0}
.comments{margin-top:26px}
.comments h3{margin-bottom:20px}
.comment-form{display:flex;gap:12px;margin:18px 0 24px}
.comment-form input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--border);background:var(--bg);color:var(--text-primary);padding:10px 0}
.comment{display:flex;gap:12px;margin:18px 0}
.comment p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.watch-aside .video-card{display:flex;gap:9px;margin:0 0 15px}
.watch-aside .thumb-link{width:160px;min-width:160px;height:90px;border-radius:9px}
.watch-aside .card-info{padding:0;gap:0;flex:1}
.watch-aside .card-info>a{display:none}
.watch-aside .card-title{font-size:13px;-webkit-line-clamp:2}
.watch-aside .card-more{width:18px}
.watch-aside .card-meta{font-size:11px}
.watch-aside h3{margin-bottom:14px}
.history-list{display:grid;gap:22px;max-width:1040px}
.history-list .video-card{display:flex;gap:20px}
.history-list .thumb-link{width:270px;min-width:270px}
.history-list .card-info{padding-top:6px;flex:1}
.history-list .card-title{font-size:18px}
.history-list .card-info>a{display:none}
.channel-result{display:flex;gap:20px;padding:18px 0;border-bottom:1px solid var(--border);align-items:center}
.channel-result .channel-copy{flex:1}
.channel-result p{margin:5px 0}
.search-heading{margin-bottom:14px}
.studio{background:var(--surface);min-height:100vh}
.studio .content{padding:90px 30px 40px}
.studio .sidebar,.studio .header{background:var(--bg)}
.studio .sidebar-item.active{color:var(--accent);background:var(--surface)}
.studio-page{max-width:1460px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:0}
.panel h2,.panel h3{margin-bottom:15px}
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--panel);border:1px solid var(--border);padding:19px 20px;border-radius:10px;min-width:0}
.stat-card label{display:block;color:var(--text-secondary);font-size:12px;margin-bottom:10px}
.stat-value{font-size:27px;letter-spacing:-.8px;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;animation:appear .2s}
.stat-card small{display:block;margin-top:10px;font-size:11px;color:var(--text-secondary)}
.dashboard-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
.feature-performance{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start}
.feature-performance .thumb-link{border-radius:8px}
.metric-list{display:grid;gap:12px}
.metric-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:0 0 10px}
.metric-line:last-child{border:0;padding:0}
.metric-line span{color:var(--text-secondary)}
.metric-line strong{font-weight:600}
.callout{border:1px solid var(--border);border-radius:10px;padding:18px;background:var(--surface);margin-top:20px}
.callout p{color:var(--text-secondary);margin:8px 0 14px}
.analytics-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}
.chart-wrap{position:relative}
.chart-svg{width:100%;height:245px;overflow:visible}
.chart-grid{stroke:var(--border);stroke-width:1}
.chart-label{fill:var(--text-secondary);font-size:11px}
.chart-tooltip{position:absolute;pointer-events:none;background:var(--text-primary);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:6px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-110%);z-index:5;display:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:86px;margin:24px 0 8px}
.bar{flex:1;min-width:0;background:var(--chart);border-radius:2px 2px 0 0;opacity:.8}
.bar:hover{opacity:1}
.realtime-dot{width:7px;height:7px;border-radius:50%;background:var(--chart);display:inline-block;margin-right:5px}
.rt-number{font-size:28px;margin-top:22px}
.top-video{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12px}
.top-video a{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:80%}
.traffic-list{display:grid;gap:16px}
.traffic-track{height:5px;border-radius:4px;background:var(--surface);margin-top:7px;overflow:hidden}
.traffic-fill{height:100%;background:var(--chart);border-radius:4px}
.below-analytics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.content-table{width:100%;border-collapse:collapse;font-size:12px}
.content-table th{text-align:left;color:var(--text-secondary);font-weight:500;padding:15px 12px;border-bottom:1px solid var(--border)}
.content-table td{padding:16px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.content-table tr:hover td{background:var(--surface)}
.table-video{display:flex;gap:14px;align-items:center;max-width:420px}
.table-video img{width:110px;height:62px;border-radius:6px;flex-shrink:0}
.table-video strong{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.table-video .row{margin-top:5px}
.table-video .icon-btn{width:28px;height:28px}
.table-panel{padding:0;overflow:hidden}
.badge{display:inline-flex;padding:4px 8px;background:var(--surface);border-radius:5px;white-space:nowrap;font-size:11px}
.badge.public{color:#168449}
.select{min-height:38px;border:1px solid var(--border);background:var(--panel);color:var(--text-primary);padding:7px 12px;border-radius:8px;max-width:100%}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px}
.field{display:grid;gap:7px;margin-bottom:18px;min-width:0}
.field label{font-size:12px;font-weight:600}
.input{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text-primary);padding:12px;min-width:0;resize:vertical}
.input:focus{border-color:var(--blue)}
textarea.input{min-height:115px}
.field small{font-size:11px;color:var(--text-secondary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.upload-preview{aspect-ratio:16/9;border:1px dashed var(--border);border-radius:10px;overflow:hidden;background:var(--surface);display:grid;place-items:center;margin-bottom:12px}
.upload-preview img{width:100%;height:100%}
.upload-label{display:inline-flex;gap:8px;cursor:pointer;align-items:center;justify-content:center;font-weight:600}
.file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.upload-label:focus-within{outline:2px solid var(--blue);outline-offset:3px}
.upload-tile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px;gap:10px}
.upload-tile .icon{width:32px;height:32px}
.preview-banner{height:145px;width:100%;object-fit:cover;border-radius:9px}
.image-setting{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:22px}
.image-setting .copy{flex:1}
.image-setting p{font-size:12px;color:var(--text-secondary);margin:7px 0 12px}
.customization{max-width:960px}
.customization .panel{margin-top:20px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 0;border-bottom:1px solid var(--border)}
.settings-row p{font-size:12px;color:var(--text-secondary);margin-top:5px}
.settings-row:last-child{border:0}
.dropdown{position:fixed;z-index:65;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:var(--shadow);width:256px;max-width:calc(100vw - 24px)}
.dropdown-item{width:100%;text-align:left;padding:11px 12px;border-radius:7px;display:flex;gap:12px;align-items:center;line-height:1.3;font-size:13px}
.dropdown-item:hover{background:var(--surface)}
.dropdown-heading{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.dropdown-heading p{font-size:12px;color:var(--text-secondary);margin-top:3px}
.modal-backdrop{position:fixed;inset:0;background:#0007;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.modal{max-width:860px;width:100%;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);animation:modalIn .18s ease}
.modal.small{max-width:480px}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:16px}
.modal-header h2{font-size:21px}
.modal-body{overflow-y:auto;padding:24px;overscroll-behavior:contain}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
.modal .form-grid{grid-template-columns:minmax(0,1fr) 260px}
.toast-container{position:fixed;bottom:24px;left:calc(var(--sidebar-width) + 24px);z-index:100;display:grid;gap:8px;pointer-events:none;max-width:calc(100vw - 48px)}
.toast{background:var(--text-primary);color:var(--bg);padding:13px 22px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;animation:appear .18s;pointer-events:auto}
.notice{padding:12px 16px;background:var(--surface);border-radius:9px;font-size:12px;color:var(--text-secondary);margin-bottom:18px}
.form-error{color:var(--accent);font-size:13px;margin-top:10px}
.progress{height:4px;background:var(--surface);overflow:hidden;border-radius:4px;margin-top:16px}
.progress span{display:block;height:100%;background:var(--blue);animation:progress 1.4s ease forwards}
.debug{position:fixed;bottom:15px;right:15px;background:#141d23;color:#85f4b3;padding:16px;z-index:60;border-radius:8px;white-space:pre;font:11px/1.8 monospace;max-width:calc(100vw - 30px)}

// SIMULATION ENGINE: impressions -> views -> engagement -> distribution feedback
function historyAdd(v,t,d){const hour=3600e3,bucket=Math.floor(t/hour)*hour;let h=v.history[v.history.length-1];if(!h||h.timestamp!==bucket){h={timestamp:bucket,views:0,impressions:0,likes:0,subscribersGained:0,watchSeconds:0,shownInFeed:0,viewedExposures:0,swipedAway:0,rewatches:0};v.history.push(h)}Object.keys(d).forEach(k=>{h[k]=(h[k]||0)+d[k]});if(v.history.length>110){const cutoff=state.simulation.now-49*hour;const merged=new Map();v.history.forEach(a=>{const key=a.timestamp<cutoff?Math.floor(a.timestamp/864e5)*864e5:a.timestamp;const old=merged.get(key)||{timestamp:key,views:0,impressions:0,likes:0,subscribersGained:0,watchSeconds:0,shownInFeed:0,viewedExposures:0,swipedAway:0,rewatches:0};Object.keys(old).filter(k=>k!=='timestamp').forEach(k=>old[k]+=(a[k]||0));merged.set(key,old)});v.history=Array.from(merged.values());if(v.history.length>420){const excess=v.history.splice(0,v.history.length-419);const first=excess[0];excess.slice(1).forEach(x=>Object.keys(first).filter(k=>k!=='timestamp').forEach(k=>first[k]+=(x[k]||0)));v.history.unshift(first)}}}
function phase(v,t=state.simulation.now){const age=(t-v.publishedAt)/3600e3;return age<2?'Первый охват':age<24?'Расширение аудитории':age<72?'Пик интереса':age<168?'Снижение активности':'Долгий хвост'}
function rates(v,c,t){const p=v.params,age=Math.max(0,(t-v.publishedAt)/3600e3),fresh=Math.exp(-age/(v.category==='Новости'?20:72));p.ctr=clamp(.009+p.clickability*.108+p.contentQuality*.022-(1-p.audienceFit)*.017-.009*Math.min(age/168,1),.01,.15);p.retention=clamp(p.retentionPotential-(v.duration>1800?.05:0),.18,.83);p.likeRate=.02+p.engagementPotential*.08;p.dislikeRate=.001+(1-p.contentQuality)*.017;p.commentRate=.0005+p.engagementPotential*.009;p.conversion=(.0005+p.contentQuality*p.audienceFit*.012)/(1+c.subscribers/2e6);p.recommendationScore=clamp((p.ctr/.14)*.25+p.retention*.25+p.engagementPotential*.15+p.audienceFit*.15+fresh*.1+c.authority*.1);
const initial=(38+Math.pow(Math.max(c.subscribers,0),.72)*.42)*(.4+p.topicDemand)*(.55+p.audienceFit);const success=clamp((p.recommendationScore-.35)*4,0,1.7),potential=p.potential;let multiplier;
if(age<2)multiplier=.65+age*.25;
else if(age<24)multiplier=1+success*potential*Math.pow((age-2)/6,1.35);
else if(age<72)multiplier=(1+success*potential*5.8)*Math.exp(-Math.pow((age-36)/42,2));
else if(age<168)multiplier=(1+success*potential*4)*Math.exp(-(age-72)/(12+p.evergreenFactor*55));
else multiplier=(.12+p.evergreenFactor*.7)*(1+success*potential)*Math.pow(168/Math.max(168,age),p.evergreenFactor>.75?.6:1.5);
if(v.category==='Новости')multiplier*=Math.exp(-age/90);const saturation=1/(1+v.views/(15000+Math.pow(c.subscribers+1,.82)*90+potential*35000));const feedback=clamp((p.recommendationScore-.2)*1.7,.2,1.5);return clamp(initial*multiplier*(1+p.momentum*5)*feedback*(1-p.competition*.35)*saturation,0,250000)}
function simulateStep(from,to){const hours=(to-from)/3600e3;if(hours<=0)return;for(const v of state.videos){if(v.visibility!=='public'||v.publishedAt>to||v.archived)continue;if(v.type==='short'){simulateShortStep(v,Math.max(from,v.publishedAt),to);continue}const c=channelBy(v.channelId),p=v.params,mid=(from+to)/2;let rate=rates(v,c,mid),hourIndex=Math.floor(to/3600e3);if(hourIndex!==p.lastSpikeHour){p.lastSpikeHour=hourIndex;const chance=.0007+p.recommendationScore*p.topicDemand*(1-p.competition)*.014;if(seeded(v.seed,hourIndex)<chance&&v.views>60&&mid-v.publishedAt<14*864e5){p.momentum=clamp(p.momentum+.2+p.recommendationScore*.35);if(c.id==='me'&&p.momentum>.45)notify('У «'+v.title+'» растёт интерес аудитории.','studio/video/'+v.id)}}p.momentum*=Math.exp(-hours/14);rate*=.92+seeded(v.seed,hourIndex+'rate')*.16;
const impressions=rate*(to-Math.max(from,v.publishedAt))/3600e3,views=impressions*p.ctr,likes=views*p.likeRate,subscribers=views*p.conversion,watchSeconds=views*v.duration*p.retention;v.impressions+=impressions;v.views+=views;v.likes+=likes;v.dislikes+=views*p.dislikeRate;v.comments+=views*p.commentRate;v.subscribersGained+=subscribers;v.watchSeconds+=watchSeconds;p.velocity=views/Math.max(hours,.0001);c.subscribers+=subscribers;c.authority=clamp(c.authority+(p.recommendationScore-c.authority)*Math.min(hours*.0004,.02),.05,.98);
const recommendation=clamp(p.recommendationScore),shares=[.19+.2*recommendation,.14+.22*recommendation,.12+.15*p.evergreenFactor,.07,.09+(c.subscribers>1000?.03:0),.04],sum=shares.reduce((a,b)=>a+b);shares.forEach((x,i)=>v.traffic[i]+=views*x/sum);if(c.id==='me')historyAdd(v,to,{views,impressions,likes,subscribersGained:subscribers,watchSeconds});}}
function advance(ms){ms=clamp(ms,0,CONFIG.offlineCap);if(!ms)return;npcPublishBudget=12;let cursor=state.simulation.now;const end=cursor+ms;const step=Math.max(5*60e3,ms/288);while(cursor<end){const to=Math.min(end,cursor+step);state.simulation.now=to;publishNPCDue(to);simulateStep(cursor,to);cursor=to}state.simulation.now=end;fastForwardNPCSchedules(end);pruneNPC();syncChannelTotals()}
function syncChannelTotals(){state.channels.forEach(c=>{const vs=state.videos.filter(v=>v.channelId===c.id);c.totalViews=(c.archivedViews||0)+vs.reduce((n,v)=>n+v.views,0);c.videoCount=(c.archivedCount||0)+vs.filter(v=>v.visibility==='public').length;c.shortCount=vs.filter(v=>v.type==='short'&&v.visibility==='public').length});state.userChannel=channelBy('me')}
function settleTime(){const now=Date.now(),elapsed=clamp(now-state.simulation.lastSimulationTimestamp,0,864e5*7);advance(elapsed*CONFIG.timeScale*state.simulation.speed);state.simulation.lastSimulationTimestamp=now}

function recommendations(exclude=null,category=activeCategory){const visible=state.videos.filter(v=>v.type!=='short'&&!v.archived&&v.id!==exclude&&v.visibility==='public'&&!state.user.notInterested.includes(v.id)&&!state.user.blockedChannels.includes(v.channelId)&&(category==='Все'||v.category===category));const window=Math.floor(state.simulation.now/(3*3600e3));const scores=visible.map(v=>{const p=v.params,interest=state.user.interests[v.category]||.35,sub=state.subscriptions.includes(v.channelId)?.24:0,fresh=Math.exp(-(state.simulation.now-v.publishedAt)/(10*864e5)),explore=seeded(v.seed,'explore'+window)*.24,pop=clamp(Math.log10(1+v.views)/6);return{v,score:interest*.31+p.recommendationScore*.23+fresh*.12+pop*.09+p.momentum*.08+sub+explore-(state.history.some(h=>h.videoId===v.id)?.06:0)}});const result=[],counts={},channels={};while(scores.length&&result.length<48){scores.sort((a,b)=>(b.score-(counts[b.v.category]||0)*.055-(channels[b.v.channelId]||0)*.13)-(a.score-(counts[a.v.category]||0)*.055-(channels[a.v.channelId]||0)*.13));const v=scores.shift().v;result.push(v);counts[v.category]=(counts[v.category]||0)+1;channels[v.channelId]=(channels[v.channelId]||0)+1}return result}

function channelPage(c){if(!c)return unavailable('Канал не найден');const own=c.id==='me',vs=state.videos.filter(v=>v.channelId===c.id&&(own||v.visibility==='public')).sort((a,b)=>b.publishedAt-a.publishedAt);const banner=safeImage(c.banner)||art({seed:c.seed,artKind:c.seed%7,artText:c.name,artSubtitle:c.handle,category:c.niche},true);return `<img class="channel-banner" src="${esc(banner)}" alt="Шапка канала ${esc(c.name)}"><div class="channel-head">${avatar(c,'large')}<div class="channel-copy"><h1>${esc(c.name)}</h1><div class="muted">${esc(c.handle)} · <span data-subs="${c.id}">${formatSubscribers(c.subscribers)}</span> · ${vs.length} ${plural(vs.length,'видео','видео','видео')}</div><p class="muted">${esc(c.description.slice(0,150))}${c.description.length>150?'…':''}</p><div class="row wrap">${own?link('studio/customization','Настроить канал','edit')+link('studio/content','Управление видео','content'):subscribeButton(c)}</div></div></div><div class="tabs" role="tablist">${[['home','Главная'],['videos','Видео'],['about','О канале']].map(([id,t])=>`<button class="tab${channelTab===id?' active':''}" role="tab" aria-selected="${channelTab===id}" data-action="channel-tab" data-tab="${id}">${t}</button>`).join('')}</div>${channelTab==='about'?`<div class="panel about-panel"><h2>О канале</h2><p>${esc(c.description)}</p><hr class="divider"><div class="metric-list"><div class="metric-line"><span>Адрес канала</span><strong>${esc(c.handle)}</strong></div><div class="metric-line"><span>Дата создания</span><strong>${date(c.createdAt)}</strong></div><div class="metric-line"><span>Всего просмотров</span><strong data-channelviews="${c.id}">${exact(c.totalViews)}</strong></div><div class="metric-line"><span>Подписчики</span><strong data-subs="${c.id}">${formatSubscribers(c.subscribers)}</strong></div></div></div>`:grid(channelTab==='home'?vs.slice(0,12):vs,'Пока здесь тихо',own?'create':'home')}`}
function unavailable(title){return `<div class="error-page">${empty(title,'Возможно, видео удалено или ссылка изменилась.',link('home','На главную','home'))}</div>`}
function watchPage(v){if(!v)return unavailable('Видео не найдено');if(v.visibility==='private'&&v.channelId!=='me')return unavailable('Видео недоступно');const c=channelBy(v.channelId),reaction=state.user.reactions[v.id],own=v.channelId==='me';return `<div class="watch-layout"><div class="watch-main"><div class="player" id="player"><img src="${esc(thumbnail(v))}" alt="${esc(v.title)}"><div class="player-caption">${esc(c.name.toUpperCase())}</div><button class="player-center" data-action="play" aria-label="Воспроизвести">${icon('play')}</button><div class="player-controls"><input id="timeline" type="range" min="0" max="${v.duration}" value="0" aria-label="Позиция воспроизведения"><div class="player-control-row">${ib('play','Воспроизвести','play','id="play-control"')}${ib('mute','Выключить звук','volume','id="mute-control"')}<input class="volume" type="range" min="0" max="1" step=".05" value="${player.volume}" aria-label="Громкость"><span class="time" id="player-time">0:00 / ${formatDuration(v.duration)}</span>${ib('fullscreen','На весь экран','fullscreen')}</div></div></div><h1 class="watch-title">${esc(v.title)}</h1><div class="watch-actions"><div class="channel-byline"><a href="#/channel/${c.id}">${avatar(c)}</a><a href="#/channel/${c.id}"><h3>${esc(c.name)}</h3><div class="tiny muted" data-subs="${c.id}">${formatSubscribers(c.subscribers)}</div></a>${subscribeButton(c)}</div><div class="reactions"><div class="reaction-group"><button class="btn${reaction==='like'?' selected':''}" data-action="reaction" data-reaction="like" data-id="${v.id}" aria-label="Нравится" aria-pressed="${reaction==='like'}">${icon('like')}<span data-likes="${v.id}">${formatNumber(v.likes)}</span></button><button class="btn${reaction==='dislike'?' selected':''}" data-action="reaction" data-reaction="dislike" data-id="${v.id}" aria-label="Не нравится" aria-pressed="${reaction==='dislike'}">${icon('dislike')}<span class="tiny" data-dislikes="${v.id}">${formatNumber(v.dislikes)}</span></button></div>${btn('share','Поделиться','share','',`data-id="${v.id}"`)}${ib('video-menu','Ещё','more',`data-id="${v.id}"`)}</div></div><div class="description" id="description"><strong><span data-views="${v.id}">${formatViews(v.views)}</span> · ${date(v.publishedAt)}</strong>${own?'<span class="live" style="margin-top:7px">Статистика обновляется</span>':''}<p>${esc(v.description||'Автор не добавил описание.')}</p><div class="tiny muted" style="margin-top:8px">${v.tags.map(t=>'#'+esc(t.replace(/\s+/g,''))).join(' ')}</div><button class="text-btn" data-action="description">Ещё</button></div><section class="comments"><h3><span data-comments="${v.id}">${exact(v.comments+v.localComments.length)}</span> ${plural(num(v.comments+v.localComments.length),'комментарий','комментария','комментариев')}</h3><form class="comment-form" data-id="${v.id}" id="comment-form">${avatar(channelBy('me'),'small')}<input name="comment" placeholder="Напишите комментарий" aria-label="Комментарий" required maxlength="1000">${btn('submit-comment','Отправить','share','', 'type="submit"')}</form><div id="local-comments">${v.localComments.map(x=>`<div class="comment">${avatar(channelBy('me'),'small')}<div><strong class="tiny">${esc(x.author)}</strong> <span class="tiny muted">${formatRelativeTime(x.at)}</span><p>${esc(x.text)}</p></div></div>`).join('')}</div><p class="tiny muted">${v.comments>1?'Аудитория оставила '+exact(v.comments)+' '+plural(num(v.comments),'комментарий','комментария','комментариев')+'.':''}</p></section></div><aside class="watch-aside"><h3>Следующее видео</h3>${recommendations(v.id,'Все').slice(0,14).map(videoCard).join('')}</aside></div>`}
function searchPage(q){const terms=q.toLocaleLowerCase('ru').trim().split(/\s+/).filter(Boolean),matches=s=>terms.every(t=>s.toLocaleLowerCase('ru').includes(t));const vs=state.videos.filter(v=>(v.visibility==='public'||v.channelId==='me')&&matches(v.title+' '+v.description+' '+v.category+' '+v.tags.join(' ')+' '+channelBy(v.channelId).name));const cs=state.channels.filter(c=>matches(c.name+' '+c.handle+' '+c.niche));return `<div class="section-head"><h1>Результаты поиска</h1><span class="muted">${vs.length} видео · ${cs.length} каналов</span></div><p class="muted search-heading">По запросу «${esc(q)}»</p>${cs.slice(0,5).map(c=>`<div class="channel-result"><a href="#/channel/${c.id}">${avatar(c,'medium')}</a><div class="channel-copy"><h3><a href="#/channel/${c.id}">${esc(c.name)}</a></h3><p class="muted">${esc(c.handle)} · ${formatSubscribers(c.subscribers)}</p><p class="muted">${esc(c.description.slice(0,110))}</p></div>${subscribeButton(c)}</div>`).join('')}${vs.length?`<div class="video-grid" style="margin-top:26px">${vs.map(videoCard).join('')}</div>`:!cs.length?empty('Ничего не найдено','Попробуйте другую тему, название видео или имя канала.',link('home','На главную')):''}`}
// ANALYTICS ENGINE
function aggregate(vs,days=period){const out={views:0,watchSeconds:0,subscribersGained:0,impressions:0,likes:0,dislikes:0,comments:0};const cutoff=days===0?0:state.simulation.now-days*864e5;vs.forEach(v=>{if(days===0){Object.keys(out).forEach(k=>out[k]+=v[k]||0)}else v.history.filter(h=>h.timestamp>=cutoff).forEach(h=>Object.keys(out).forEach(k=>out[k]+=h[k]||0))});out.ctr=out.impressions?out.views/out.impressions:0;out.retention=out.views?vs.reduce((n,v)=>n+v.views*v.params.retention,0)/Math.max(1,vs.reduce((n,v)=>n+v.views,0)):0;return out}
function series(vs,days=period,metric=chartMetric){const earliest=Math.min(state.simulation.now,...vs.map(v=>v.publishedAt)),actualDays=days||Math.max(1,Math.ceil((state.simulation.now-earliest)/864e5)+1),count=Math.min(actualDays,90),width=actualDays*864e5/count,end=Math.floor(state.simulation.now/864e5)*864e5+864e5,start=end-count*width;const points=Array.from({length:count},(_,i)=>({t:start+i*width,value:0}));vs.forEach(v=>v.history.forEach(h=>{const i=Math.floor((h.timestamp-start)/width);if(i>=0&&i<count)points[i].value+=h[metric]||0}));return points}
function statCards(stats,video=false){const values=[['Просмотры',stats.views,formatNumber,'views'],['Время просмотра',stats.watchSeconds/3600,n=>n.toLocaleString('ru-RU',{maximumFractionDigits:1})+' ч','watchSeconds'],['Новые подписчики',stats.subscribersGained,n=>'+'+formatNumber(n),'subscribersGained'],['Показы',stats.impressions,formatNumber,'impressions'],['CTR значков',stats.ctr,pct,'ctr']];return `<div class="stat-grid">${values.map(([label,value,format,key])=>`<button class="stat-card" data-action="chart-metric" data-metric="${key}" aria-label="График: ${label}" aria-pressed="${chartMetric===key}"${key===chartMetric?' style="border-color:var(--chart)"':''}><label>${label}</label><div class="stat-value" data-stat="${key}">${format(value)}</div><small>${period===0?'За всё время':'За выбранный период'}</small></button>`).join('')}</div>`}
function chart(vs){const points=series(vs).map(p=>({...p,value:chartMetric==='watchSeconds'?p.value/3600:p.value})),max=Math.max(1,...points.map(p=>p.value)),W=780,H=240,left=4,right=58,top=15,bottom=32,cw=W-left-right,ch=H-top-bottom;const coords=points.map((p,i)=>[left+(points.length===1?.5:i/(points.length-1))*cw,top+ch-p.value/max*ch]);let path=coords.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ');if(coords.length===1)path=`M${left} ${coords[0][1]} L${left+cw} ${coords[0][1]}`;const area=path+` L${left+cw} ${top+ch} L${left} ${top+ch} Z`;const lines=[0,.25,.5,.75,1].map(k=>{const y=top+ch-k*ch;return `<line x1="${left}" x2="${W-right}" y1="${y}" y2="${y}" class="chart-grid"/><text x="${W-right+8}" y="${y+4}" class="chart-label">${formatNumber(max*k)}</text>`}).join('');return `<div class="chart-wrap" data-chart="main"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="График статистики по времени"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart)" stop-opacity=".16"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>${lines}<path d="${area}" fill="url(#chartFill)"/><path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2.5"/>${[0,Math.floor((points.length-1)/2),points.length-1].filter((x,i,a)=>a.indexOf(x)===i).map(i=>`<text x="${coords[i][0]}" y="233" text-anchor="${i===0?'start':i===points.length-1?'end':'middle'}" class="chart-label">${new Date(points[i].t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</text>`).join('')}${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${points.length<10?4:2}" fill="var(--chart)"/><rect x="${Math.max(0,x-cw/Math.max(1,points.length-1)/2)}" y="0" width="${Math.max(12,cw/Math.max(1,points.length-1))}" height="225" fill="transparent" class="chart-hit" tabindex="0" data-value="${esc(chartMetric==='watchSeconds'?points[i].value.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ч':exact(points[i].value))}" data-date="${date(points[i].t)}" aria-label="${date(points[i].t)}: ${exact(points[i].value)}"/>`).join('')}</svg><div class="chart-tooltip" role="tooltip"></div></div>`}
function realtime(vs){const cutoff=state.simulation.now-48*3600e3,buckets=Array(48).fill(0);vs.forEach(v=>v.history.forEach(h=>{const i=Math.floor((h.timestamp-cutoff)/3600e3);if(i>=0&&i<48)buckets[i]+=h.views}));const total=buckets.reduce((a,b)=>a+b),max=Math.max(1,...buckets);const tops=vs.map(v=>({v,views:v.history.filter(h=>h.timestamp>=cutoff).reduce((s,h)=>s+h.views,0)})).sort((a,b)=>b.views-a.views).slice(0,3);return `<div class="panel realtime-panel"><h3>В реальном времени</h3><p class="tiny muted"><span class="realtime-dot"></span>Обновляется автоматически</p><div class="rt-number" data-rt-subs>${formatNumber(channelBy('me').subscribers)}</div><p class="tiny muted">Подписчиков на канале</p><hr class="divider"><strong data-rt-views>${exact(total)}</strong><span class="tiny muted"> просмотров · 48 часов</span><div class="bars">${buckets.map((n,i)=>`<div class="bar" style="height:${Math.max(2,n/max*100)}%" title="${48-i} ч назад: ${exact(n)} просмотров"></div>`).join('')}</div><div class="row between tiny muted"><span>48 ч назад</span><span>Сейчас</span></div><hr class="divider"><p class="tiny muted">Самые популярные видео</p>${tops.map(x=>`<div class="top-video"><a href="#/studio/video/${x.v.id}">${esc(x.v.title)}</a><strong>${exact(x.views)}</strong></div>`).join('')}${!vs.length?'<p class="tiny muted" style="margin-top:14px">Статистика появится после публикации.</p>':''}</div>`}
function traffic(vs){const sums=Array(SOURCE_NAMES.length).fill(0);vs.forEach(v=>v.traffic.forEach((n,i)=>sums[i]+=n));const total=sums.reduce((a,b)=>a+b);return `<div class="panel"><h3>Источники трафика</h3><p class="chart-period-copy">Распределение просмотров за всё время</p><div class="traffic-list">${SOURCE_NAMES.map((s,i)=>`<div><div class="row between tiny"><span>${s}</span><strong>${total?pct(sums[i]/total):'0 %'}</strong></div><div class="traffic-track"><div class="traffic-fill" style="width:${total?sums[i]/total*100:0}%"></div></div></div>`).join('')}</div></div>`}
const periodSelect=()=>`<select class="select" id="period-select" aria-label="Период аналитики">${[[7,'Последние 7 дней'],[28,'Последние 28 дней'],[90,'Последние 90 дней'],[0,'Всё время']].map(([n,t])=>`<option value="${n}"${period===n?' selected':''}>${t}</option>`).join('')}</select>`;
function analytics(v=null){const vs=v?[v]:analyticsVideos(),stats=aggregate(vs),label=chartMetric==='views'?'Просмотры':chartMetric==='watchSeconds'?'Время просмотра':chartMetric==='subscribersGained'?'Новые подписчики':'Показы';return `<div class="studio-page"><div class="section-head"><div>${v?`<a class="tiny muted" href="#/studio/content">← Контент канала</a>`:''}<h1>${v?'Аналитика видео':'Аналитика канала'}</h1>${v?`<p class="muted tiny" style="margin-top:5px">${esc(v.title)}</p>`:''}</div><div class="studio-actions">${v?btn('edit-video','Изменить','edit','outline',`data-id="${v.id}"`):''}${periodSelect()}</div></div>${statCards(stats,!!v)}<div class="analytics-layout"><div class="panel"><div class="row between" style="margin-bottom:8px"><h3>${label}</h3><span class="live">${state.simulation.speed?'Обновляется':'Приостановлено'}</span></div><p class="chart-period-copy">${period===0?'За всё время':'Последние '+period+' дней'} · ${v?phase(v):vs.length+' видео'}</p><div id="analytics-chart">${chart(vs)}</div>${!vs.length?`<div class="callout"><h3>Ваша история начинается здесь</h3><p>Опубликуйте первое видео, чтобы узнать, как его находит и смотрит аудитория.</p>${btn('create','Создать видео','create','primary')}</div>`:''}</div><div id="realtime-panel">${realtime(vs)}</div></div>${analyticsBottom(vs,v)}</div>`}
function analyticsBottom(vs,v){return `<div class="below-analytics" id="analytics-bottom">${traffic(vs)}<div class="panel"><h3>${v?'Вовлечение аудитории':'Популярные видео'}</h3><p class="chart-period-copy">За всё время</p>${v?`<div class="metric-list">${[['Средняя длительность просмотра',formatDuration(v.views?v.watchSeconds/v.views:0)],['Средний процент просмотра',pct(v.views?v.watchSeconds/v.views/v.duration:0)],['Нравится',exact(v.likes)],['Не нравится',exact(v.dislikes)],['Комментарии',exact(v.comments+v.localComments.length)],['Длительность видео',formatDuration(v.duration)],['Этап распространения',phase(v)]].map(([k,val])=>`<div class="metric-line"><span>${k}</span><strong>${val}</strong></div>`).join('')}</div>`:mine().sort((a,b)=>b.views-a.views).slice(0,5).map(v=>`<div class="top-video"><a href="#/studio/video/${v.id}">${esc(v.title)}</a><strong class="nowrap" data-cardcount="${v.id}">${formatNumber(v.views)}</strong></div>`).join('')||'<p class="muted">Здесь будут ваши самые популярные истории.</p>'}</div></div>`}
function speedSelect(){return `<select class="select" id="speed-select" aria-label="Скорость времени">${[[0,'Пауза'],[1,'1×'],[5,'5×'],[20,'20×']].map(([n,t])=>`<option value="${n}"${state.simulation.speed===n?' selected':''}>${t}</option>`).join('')}</select>`}
function dashboard(){const vs=mine(),c=channelBy('me'),all=aggregate(vs,0),recent=vs.reduce((n,v)=>n+v.history.filter(h=>h.timestamp>=state.simulation.now-48*3600e3).reduce((s,h)=>s+h.views,0),0),latest=vs[0],top=vs.slice().sort((a,b)=>b.views-a.views)[0];return `<div class="studio-page"><div class="section-head"><h1>Обзор канала</h1><div class="studio-actions"><span class="tiny muted">Темп обновлений</span>${speedSelect()}${btn('create','Создать','create','primary')}</div></div><div class="stat-grid">${[['Подписчики',c.subscribers],['Просмотры канала',all.views],['Опубликовано видео',vs.filter(v=>v.visibility==='public').length],['Просмотры за 48 часов',recent],['Время просмотра, ч',all.watchSeconds/3600]].map(([k,n],i)=>`<div class="stat-card"><label>${k}</label><div class="stat-value" data-dashboard="${i}">${i===4?n.toLocaleString('ru-RU',{maximumFractionDigits:1}):formatNumber(n)}</div><small>${i===2?'В открытом доступе':'Все данные вашего канала'}</small></div>`).join('')}</div><div class="dashboard-grid"><div class="panel"><h2>${latest?'Последнее видео':'Опубликуйте первое видео'}</h2>${latest?`<div class="feature-performance"><a class="thumb-link" href="#/${videoRoute(latest)}" data-format="${latest.type||'video'}"><img class="thumbnail" src="${esc(thumbnail(latest))}" alt=""><span class="duration">${formatDuration(latest.duration)}</span></a><div><h3>${esc(latest.title)}</h3><p class="tiny muted" style="margin:8px 0 15px">${formatRelativeTime(latest.publishedAt)} · ${phase(latest)}</p><div class="metric-list"><div class="metric-line"><span>Просмотры</span><strong data-views="${latest.id}">${formatViews(latest.views)}</strong></div><div class="metric-line"><span>${isShort(latest)?'Показано в ленте':'Показы'}</span><strong data-${isShort(latest)?'shown':'impressions'}="${latest.id}">${exact(isShort(latest)?latest.shortStats.shownInFeed:latest.impressions)}</strong></div><div class="metric-line"><span>${isShort(latest)?'Продолжили смотреть':'CTR'}</span><strong function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Не удалось прочитать файл.'));reader.readAsDataURL(file)})}
async function optimizeImage(file,kind){if(!file||!/^image\/(jpeg|png|webp|gif|bmp|avif)$/.test(file.type))throw Error('Выберите изображение JPG, PNG, WebP, GIF или AVIF.');if(file.size>30*1024*1024)throw Error('Размер изображения не должен превышать 30 МБ.');const data=await readFile(file),img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Этот формат изображения не удалось открыть.'));im.src=data});const [w,h]=kind==='avatar'?[512,512]:kind==='banner'?[1440,480]:kind==='short'?[540,960]:[960,540];const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Браузер не поддерживает обработку изображений.');const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);ctx.fillStyle='#f0f0f0';ctx.fillRect(0,0,w,h);ctx.drawImage(img,(w-img.naturalWidth*scale)/2,(h-img.naturalHeight*scale)/2,img.naturalWidth*scale,img.naturalHeight*scale);let quality=.8,result=canvas.toDataURL('image/webp',quality);while(result.length>150000&&quality>.4){quality-=.1;result=canvas.toDataURL('image/webp',quality)}return result}
async function handleImage(input){const kind=input.name;if(kind==='import'){await importData(input.files[0]);return}const draft=kind==='thumbnail'?videoDraft:editingImage;if(!draft)return;draft.pending++;try{const source=input.files[0];const image=await optimizeImage(source,kind==='thumbnail'&&draft.type==='short'?'short':kind);if(kind==='thumbnail')draft.originalThumbnail=source;const stored=await ImageStore.put(image);if((kind==='thumbnail'?videoDraft:editingImage)!==draft)return;draft[kind]=stored;const preview=kind==='thumbnail'?$('#thumbnail-preview'):kind==='avatar'?$('#avatar-preview'):$('#banner-preview');if(preview){if(kind==='banner')preview.src=image;else preview.innerHTML=kind==='avatar'?`<span class="avatar large"><img src="${image}" alt="Фото профиля"></span>`:`<img src="${image}" alt="Превью видео">`}toast(kind==='thumbnail'?'Обложка готова':'Изображение готово. Сохраните изменения.')}catch(e){toast(e.message)}finally{draft.pending--}}
function parseDuration(s){const a=s.split(':').map(Number);if(a.length<2||a.length>3||a.some(n=>!Number.isFinite(n)||n<0)||a.at(-1)>59||a.length===3&&a[1]>59)return 0;return a.reduce((n,x)=>n*60+x,0)}

function shortFrame(v,index){const c=channelBy(v.channelId),reaction=state.user.reactions[v.id];return `<article class="shorts-item" data-short-id="${v.id}" data-index="${index}" aria-label="Shorts: ${esc(v.title)}"><div class="short-stage"><img src="${esc(thumbnail(v))}" alt="${esc(v.title)}" loading="${index===0?'eager':'lazy'}">${ib('short-play','Пауза Shorts','pause','class="icon-btn short-toggle"')}<span class="short-position">${index+1} / ${shortsCatalog.length}</span><div class="short-footer"><div class="short-channel row"><a href="#/channel/${c.id}" aria-label="Канал ${esc(c.name)}">${avatar(c,'small')}</a><a href="#/channel/${c.id}">${esc(c.handle)}</a>${subscribeButton(c)}</div><h2>${esc(v.title)}</h2><button class="text-btn" data-action="short-description" data-id="${v.id}">Описание · <span data-views="${v.id}">${formatViews(v.views)}</span></button></div><div class="short-actions"><div class="short-action"><button data-action="reaction" data-id="${v.id}" data-reaction="like" aria-label="Нравится" aria-pressed="${reaction==='like'}">${icon('like')}</button><span data-likes="${v.id}">${formatNumber(v.likes)}</span></div><div class="short-action"><button data-action="reaction" data-id="${v.id}" data-reaction="dislike" aria-label="Не нравится" aria-pressed="${reaction==='dislike'}">${icon('dislike')}</button><span>Не нравится</span></div><div class="short-action"><button data-action="short-comments" data-id="${v.id}" aria-label="Комментарии">${icon('comments')}</button><span data-comments="${v.id}">${exact(v.comments+v.localComments.length)}</span></div><div class="short-action"><button data-action="share" data-id="${v.id}" aria-label="Поделиться">${icon('share')}</button><span>Поделиться</span></div><div class="short-action"><button data-action="video-menu" data-id="${v.id}" aria-label="Ещё">${icon('more')}</button></div></div><div class="short-progress"><span></span></div></div></article>`}
function shortsPage(id=''){const target=id?videoBy(id):null;if(id&&(!target||!isShort(target)||(target.visibility==='private'&&target.channelId!=='me')))return unavailable('Shorts не найден');const recs=shortRecommendations(target?.id);shortsCatalog=[...(target?[target]:[]),...recs].map(v=>v.id);shortsWindow={start:0,end:Math.min(12,shortsCatalog.length)};if(!shortsCatalog.length)return empty('Пока нет Shorts','Опубликуйте вертикальную историю или сбросьте скрытые рекомендации.',btn('create-short','Создать Shorts','shorts','primary'));return `<div class="shorts-feed" id="shorts-feed" tabindex="0" aria-label="Лента Shorts">${shortsCatalog.slice(0,12).map((id,i)=>shortFrame(videoBy(id),i)).join('')}</div><div class="short-nav">${ib('short-prev','Предыдущий Shorts','back','class="icon-btn up"')}${ib('short-next','Следующий Shorts','back','class="icon-btn down"')}</div>`}
function finishShort(){const v=videoBy(shortPlayback.id);if(v&&!shortPlayback.viewed&&shortPlayback.elapsed>0){v.shortStats.swipedAway++;interest(v,-.035);if(v.channelId==='me')historyAdd(v,state.simulation.now,{swipedAway:1});saveState()}shortPlayback.id=null}
function stopShorts(){if(shortsObserver){shortsObserver.disconnect();shortsObserver=null}finishShort()}
function mountShorts(){const feed=$('#shorts-feed');if(!feed)return;shortsObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>.62).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible)activateShort(visible.target.dataset.shortId)},{root:feed,threshold:[.1,.65,.9]});$$('.shorts-item',feed).forEach(el=>shortsObserver.observe(el));feed.addEventListener('scroll',()=>{const active=$('.shorts-item[data-short-id="'+shortPlayback.id+'"]');if(active&&Number(active.dataset.index)>=shortsWindow.end-3)extendShortWindow()},{passive:true});activateShort(shortsCatalog[0])}
function activateShort(id){if(shortPlayback.id===id)return;finishShort();const v=videoBy(id);if(!v)return;shortPlayback={id,time:0,elapsed:0,playing:true,viewed:false,lastTick:performance.now(),loop:0};v.shortStats.shownInFeed++;state.user.shortHistory=[{videoId:id,timestamp:state.simulation.now},...state.user.shortHistory.filter(x=>x.videoId!==id)].slice(0,200);state.history=[{videoId:id,timestamp:state.simulation.now},...state.history.filter(x=>x.videoId!==id)].slice(0,CONFIG.historyLimit);if(v.channelId==='me')historyAdd(v,state.simulation.now,{shownInFeed:1});if(location.hash!=='#/shorts/'+id)history.replaceState(null,'','#/shorts/'+id);state.currentRoute='shorts/'+id;saveState();updateShortControls();updateLive()}
function extendShortWindow(){const feed=$('#shorts-feed');if(!feed||shortsWindow.end>=shortsCatalog.length)return;const start=shortsWindow.end,end=Math.min(start+6,shortsCatalog.length);for(let i=start;i<end;i++){feed.insertAdjacentHTML('beforeend',shortFrame(videoBy(shortsCatalog[i]),i));shortsObserver?.observe(feed.lastElementChild)}shortsWindow.end=end;if(end-shortsWindow.start>18){const elements=$$('.shorts-item',feed).slice(0,6),height=elements.reduce((n,e)=>n+e.getBoundingClientRect().height,0);for(const e of elements){shortsObserver?.unobserve(e);e.remove()}shortsWindow.start+=6;feed.scrollTop-=height}}
function shortStep(direction){const feed=$('#shorts-feed');if(!feed)return;let index=shortsCatalog.indexOf(shortPlayback.id)+direction;while(index>=0&&index<shortsCatalog.length){const v=videoBy(shortsCatalog[index]);if(v&&!state.user.blockedChannels.includes(v.channelId)&&!state.user.notInterested.includes(v.id))break;index+=direction}if(index<0){toast('Вы в начале ленты');return}if(index>=shortsCatalog.length){toast('Вы посмотрели подборку. Откройте Shorts снова для новых рекомендаций.');return}let el=$('.shorts-item[data-index="'+index+'"]',feed);if(!el){shortsObserver?.disconnect();const start=Math.max(0,index-3),end=Math.min(shortsCatalog.length,start+12);feed.innerHTML=shortsCatalog.slice(start,end).map((id,i)=>shortFrame(videoBy(id),i+start)).join('');shortsWindow={start,end};$$('.shorts-item',feed).forEach(e=>shortsObserver?.observe(e));el=$('.shorts-item[data-index="'+index+'"]',feed)}el?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}
function updateShortControls(){const frame=$('.shorts-item[data-short-id="'+shortPlayback.id+'"]');if(!frame)return;const button=$('[data-action=short-play]',frame);button.innerHTML=icon(shortPlayback.playing?'pause':'play');button.setAttribute('aria-label',shortPlayback.playing?'Пауза Shorts':'Воспроизвести Shorts');const progress=$('.short-progress span',frame),v=videoBy(shortPlayback.id);if(v&&progress)progress.style.width=(shortPlayback.time/v.duration*100)+'%'}
setInterval(()=>{if(!shortPlayback.id||!shortPlayback.playing||document.visibilityState==='hidden'||$('.modal'))return;const now=performance.now(),dt=Math.min(1,(now-shortPlayback.lastTick)/1000);shortPlayback.lastTick=now;const v=videoBy(shortPlayback.id);if(!v)return;shortPlayback.time+=dt;shortPlayback.elapsed+=dt;let watch=0,views=0,viewed=0,rewatches=0;if(!shortPlayback.viewed&&shortPlayback.elapsed>=Math.min(2,v.duration)){shortPlayback.viewed=true;v.views++;v.shortStats.viewedExposures++;views=1;viewed=1;watch=shortPlayback.elapsed;interest(v,.045)}else if(shortPlayback.viewed)watch=dt;v.watchSeconds+=watch;if(views)v.traffic[6]+=views;if(shortPlayback.time>=v.duration){if(state.preferences.shortAutoplay){shortStep(1);shortPlayback.playing=false}else{shortPlayback.time=0;shortPlayback.loop++;v.views++;v.shortStats.rewatches++;v.traffic[6]++;views++;rewatches++}}if(v.channelId==='me'&&(watch||views||viewed))historyAdd(v,state.simulation.now,{views,watchSeconds:watch,viewedExposures:viewed,rewatches});if(views){syncChannelTotals();saveState();updateLive()}updateShortControls()},250);
actions['short-play']=()=>{shortPlayback.playing=!shortPlayback.playing;shortPlayback.lastTick=performance.now();updateShortControls()};actions['short-prev']=()=>shortStep(-1);actions['short-next']=()=>shortStep(1);
actions['short-description']=b=>{const v=videoBy(b.dataset.id);if(!v)return;openModal(v.title,`<p class="muted tiny" style="margin-bottom:16px">${formatViews(v.views)} · ${date(v.publishedAt)} · ${formatDuration(v.duration)}</p><p class="short-desc">${esc(v.description||'Автор не добавил описание.')}</p><p class="muted tiny" style="margin-top:16px">${v.tags.map(t=>'#'+esc(t)).join(' ')}</p>`,btn('close-modal','Закрыть','','outline'),true)};
function showShortComments(v){openModal('Комментарии · '+exact(v.comments+v.localComments.length),`<div class="short-comments"><p class="muted tiny">${esc(v.title)}</p><form class="comment-form" id="short-comment-form" data-id="${v.id}">${avatar(channelBy('me'),'small')}<input name="comment" aria-label="Комментарий Shorts" placeholder="Напишите комментарий" maxlength="1000" required><button type="submit" class="btn">${icon('share')}Отправить</button></form>${v.localComments.map(x=>`<div class="comment">${avatar(channelBy('me'),'small')}<div><strong class="tiny">${esc(x.author)}</strong><p>${esc(x.text)}</p></div></div>`).join('')}<p class="tiny muted">Аудитория оставила ${exact(v.comments)} комментариев.</p></div>`,btn('close-modal','Закрыть','','outline'),true)}
actions['short-comments']=b=>{const v=videoBy(b.dataset.id);if(v)showShortComments(v)};
document.addEventListener('submit',e=>{if(e.target.id!=='short-comment-form')return;e.preventDefault();const v=videoBy(e.target.dataset.id),text=e.target.comment.value.trim();if(v&&text){v.localComments.unshift({id:uid('comment'),text,author:channelBy('me').name,at:state.simulation.now});v.localComments=v.localComments.slice(0,100);saveState();showShortComments(v);updateLive();toast('Комментарий добавлен')}});
document.addEventListener('keydown',e=>{if(!state?.currentRoute.startsWith('shorts')||$('.modal')||$('.dropdown')||(e.key===' '&&/BUTTON|A/.test(e.target.tagName))||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowDown','PageDown','ArrowUp','PageUp',' '].includes(e.key)){e.preventDefault();if(e.key===' ')actions['short-play']();else shortStep(e.key==='ArrowDown'||e.key==='PageDown'?1:-1)}});
const baseNotInterested=actions['not-interested'],baseBlockChannel=actions['block-channel'];actions['not-interested']=b=>{baseNotInterested(b);if(state.currentRoute.startsWith('shorts'))shortStep(1)};actions['block-channel']=b=>{baseBlockChannel(b);if(state.currentRoute.startsWith('shorts'))shortStep(1)};
const baseSettings=settings;settings=function(){const html=baseSettings();return html.replace('<div class="settings-row"><div><strong>Рекомендации',`<div class="settings-row"><div><strong>Автопереход Shorts</strong><p>После окончания автоматически открывать следующую короткую историю.</p></div><select id="short-autoplay" class="select" aria-label="Автопереход Shorts"><option value="off"${!state.preferences.shortAutoplay?' selected':''}>Выключен</option><option value="on"${state.preferences.shortAutoplay?' selected':''}>Включён</option></select></div><div class="settings-row"><div><strong>Рекомендации`).replace('Настройки, метаданные и небольшие структуры','Настройки, метаданные и небольшие структуры').replace('Данных ·','данных ·').replace('Сохранено локально',ImageStore.available?'Изображения в IndexedDB':'Резервный режим')};
document.addEventListener('change',e=>{if(e.target.id==='short-autoplay'){state.preferences.shortAutoplay=e.target.value==='on';saveState()}});
const baseDeleteVideo=deleteVideo;deleteVideo=function(id){baseDeleteVideo(id);ImageStore.collect()};
const basePhase=phase;phase=function(v,t=state.simulation.now){if(!isShort(v))return basePhase(v,t);const age=(t-v.publishedAt)/3600e3;return age<1?'Тестовая аудитория':age<12?'Расширение ленты':age<36?'Пик интереса':age<150?'Следующие волны':'Долгий хвост'};

function fastForwardNPCSchedules(now){for(const c of state.channels)if(c.id!=='me'&&c.nextUploadAt<=now)c.nextUploadAt=now+(0.3+seeded(c.seed,'catchup'+Math.floor(now/864e5)))*864e5/Math.max(1,c.uploadFrequency)}
const baseAvatar=avatar;avatar=function(c,cls=''){return baseAvatar({...c,avatar:safeImage(c.avatar)||null},cls)};

actions['backup-raw']=()=>{try{const raw=localStorage.getItem(CONFIG.key)||'{}',blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='youtrube-original-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch{toast('Хранилище браузера недоступно.')}};
// APP INIT (v1 state remains under the same browser storage key)
async function boot(){state=loadState();document.documentElement.dataset.theme=state.preferences.theme;$('#app').innerHTML='<main class="boot-screen"><span class="brandmark"></span><h1>YouTrube</h1><p class="muted">Открываем ваше пространство…</p></main>';await ImageStore.open();await migrateImages();seedShortEcosystem();await ImageStore.collect();const beforeViews=mine().reduce((n,v)=>n+v.views,0);settleTime();const offlineViews=mine().reduce((n,v)=>n+v.views,0)-beforeViews;syncChannelTotals();routeChange();saveState(true);if(offlineViews>=1)setTimeout(()=>toast('Пока вас не было: +'+exact(offlineViews)+' просмотров'),400);if(!ImageStore.available)toast('Хранилище изображений недоступно. Используется резервное сохранение в браузере.');}
window.addEventListener('hashchange',()=>{if(state)routeChange()});
boot().catch(error=>{console.error(error);$('#app').innerHTML='<main class="boot-screen"><h1>Не удалось открыть данные</h1><p>Исходная запись сохранена. Экспортируйте её перед восстановлением резервной копии.</p>'+btn('backup-raw','Экспорт исходных данных','upload','outline')+imageInput('import','Восстановить копию','.json,application/json')+'</main>'});
setInterval(()=>{if(!state||document.visibilityState==='hidden')return;settleTime();updateLive();saveState()},2000);
document.addEventListener('visibilitychange',()=>{if(!state)return;if(document.visibilityState==='hidden'){settleTime();saveState(true);player.playing=false;shortPlayback.playing=false}else{settleTime();updateLive();updatePlayer();saveState()}});
window.addEventListener('pagehide',()=>{if(state){settleTime();saveState(true)}});window.addEventListener('beforeunload',()=>{if(state){settleTime();saveState(true)}});
})();
</script>
