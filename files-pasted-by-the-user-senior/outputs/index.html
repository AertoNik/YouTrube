<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Кадр — видео, идеи и ваши истории.">
<title>Кадр — видео и идеи</title>
<style>
:root{--bg:#fff;--surface:#f5f5f5;--surface-hover:#eaeaea;--text-primary:#111;--text-secondary:#666;--border:#e5e5e5;--accent:#e62737;--blue:#065fd4;--sidebar-width:216px;--header-height:64px;--panel:#fff;--shadow:0 8px 40px #0002;--chart:#2389d7;--radius:12px}

[data-theme=dark]{--bg:#0f0f0f;--surface:#222;--surface-hover:#333;--text-primary:#f1f1f1;--text-secondary:#aaa;--border:#303030;--accent:#ff4757;--blue:#7db5ff;--panel:#191919;--shadow:0 8px 40px #0007;--chart:#56b8ff}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer;color:inherit}
button:disabled{cursor:wait;opacity:.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;object-fit:cover}
button{border:0;background:none}
svg{display:block}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,a{transition:background .16s,color .16s,transform .16s}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1{font-size:27px;letter-spacing:-.6px;line-height:1.3}
h2{font-size:21px;letter-spacing:-.35px}
h3{font-size:16px}
.muted{color:var(--text-secondary)}
.tiny{font-size:12px}
.nowrap{white-space:nowrap}
.divider{border:0;border-top:1px solid var(--border);margin:16px 0}
.icon-btn{height:40px;width:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.icon-btn:hover{background:var(--surface-hover)}
.btn{min-height:38px;padding:9px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:24px;background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-hover)}
.btn.primary{background:var(--text-primary);color:var(--bg)}
.btn.blue{background:var(--blue);color:var(--bg)}
.btn.outline{border:1px solid var(--border);background:transparent}
.btn.danger{color:var(--accent)}
.btn .icon{width:19px;height:19px}
.btn.selected{background:var(--surface-hover);color:var(--blue)}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.gap8{gap:8px}
.stack{display:grid;gap:18px}
.avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:#b6c9c1;color:#173b30;font-weight:700;overflow:hidden}
.avatar img{height:100%;width:100%}
.avatar.large{width:120px;height:120px;font-size:40px}
.avatar.medium{width:64px;height:64px;font-size:23px}
.avatar.small{height:30px;width:30px;font-size:11px}
.header{position:fixed;inset:0 0 auto;height:var(--header-height);background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 16px;gap:24px}
.brand{display:flex;align-items:center;gap:8px;font-size:25px;letter-spacing:-1px;font-weight:800;white-space:nowrap}
.brandmark{width:31px;height:24px;background:var(--accent);border-radius:8px;transform:skew(-7deg);display:grid;place-items:center}
.brandmark:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px;transform:skew(7deg)}
.brand small{font-size:12px;letter-spacing:0;font-weight:500;color:var(--text-secondary);align-self:flex-end;margin:0 0 5px 2px}
.header-left{display:flex;align-items:center;gap:12px;min-width:192px}
.search{display:flex;max-width:640px;flex:1;height:40px}
.search input{width:100%;min-width:0;border:1px solid var(--border);border-radius:24px 0 0 24px;background:var(--bg);color:var(--text-primary);padding:0 20px;font-size:16px;box-shadow:inset 0 1px 2px #00000005}
.search button{width:62px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-left:0;border-radius:0 24px 24px 0;display:grid;place-items:center}
.search button:hover{background:var(--surface-hover)}
.header-actions{display:flex;align-items:center;gap:10px}
.profile-btn{padding:0;margin-left:6px}
.profile-btn .avatar{width:33px;height:33px}
.create-top{padding-right:16px}
.sidebar{position:fixed;top:var(--header-height);left:0;bottom:0;width:var(--sidebar-width);padding:10px 12px 24px;overflow-y:auto;background:var(--bg);z-index:20;scrollbar-width:thin}
.sidebar-item{height:43px;border-radius:10px;display:flex;align-items:center;gap:22px;padding:0 12px;margin:2px 0;white-space:nowrap}
.sidebar-item:hover{background:var(--surface)}
.sidebar-item.active{background:var(--surface);font-weight:600}
.sidebar-item.active .icon{stroke-width:2.25}
.sidebar-label{padding:12px;font-size:13px;font-weight:600}
.sidebar-foot{padding:12px;font-size:11px;line-height:1.8;color:var(--text-secondary)}
.sidebar-channel{padding:18px 0;text-align:center}
.sidebar-channel .avatar{margin:0 auto 12px}
.sidebar-channel h3{overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.compact{--sidebar-width:76px}
.compact .sidebar-item{height:70px;flex-direction:column;gap:5px;padding:12px 0;font-size:10px}
.compact .sidebar-label,.compact .sidebar-foot,.compact .sidebar .divider,.compact .sidebar-channel,.compact .subscription-links{display:none}
.content{margin-left:var(--sidebar-width);padding:88px 32px 40px;min-height:100vh;max-width:2200px}
.chips{position:sticky;top:64px;padding:12px 0 20px;background:var(--bg);z-index:10;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:-24px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:8px;padding:7px 13px;background:var(--surface);white-space:nowrap;font-weight:600}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--text-primary);color:var(--bg)}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 18px}
.video-card{min-width:0;position:relative}
.thumb-link{display:block;position:relative;overflow:hidden;border-radius:12px;background:var(--surface);aspect-ratio:16/9}
.thumbnail{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.thumb-link:hover .thumbnail{transform:scale(1.035)}
.thumb-link:after{content:"▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:45px;height:45px;display:grid;place-items:center;border-radius:50%;background:#0007;color:white;opacity:0;transition:opacity .2s}
.thumb-link:hover:after{opacity:1}
.duration{position:absolute;bottom:8px;right:8px;padding:1px 5px;font-size:12px;font-weight:600;background:#000b;color:#fff;border-radius:4px}
.fresh{position:absolute;top:9px;left:9px;font-size:10px;text-transform:uppercase;letter-spacing:1px;background:#fff;color:#111;padding:4px 7px;border-radius:4px;font-weight:700}
.card-info{display:flex;align-items:flex-start;gap:11px;padding-top:11px}
.card-copy{min-width:0;flex:1}
.card-title{font-weight:600;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 5px}
.card-meta{font-size:12px;line-height:1.6;color:var(--text-secondary)}
.card-meta a:hover{color:var(--text-primary)}
.card-more{width:26px;height:30px;margin-right:-6px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-copy{margin-bottom:24px;max-width:720px}
.page-copy p{margin-top:8px;color:var(--text-secondary)}
.bottom-nav{display:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;gap:12px;min-height:290px}
.empty-symbol{background:var(--surface);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px}
.empty-symbol .icon{height:36px;width:36px}
.empty p{color:var(--text-secondary);max-width:400px}
.channel-banner{height:190px;width:100%;border-radius:14px;object-fit:cover;margin-bottom:26px}
.channel-head{display:flex;gap:24px;align-items:center;margin:0 0 28px}
.channel-copy{min-width:0;overflow-wrap:anywhere}
.channel-copy h1{font-size:34px;margin-bottom:8px}
.channel-copy p{margin:9px 0;max-width:800px;white-space:pre-wrap;overflow-wrap:anywhere}
.channel-head .row{margin-top:14px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:26px;overflow:auto}
.tab{padding:11px 0 13px;white-space:nowrap;color:var(--text-secondary);font-size:15px;font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:var(--text-primary);border-bottom-color:var(--text-primary)}
.about-panel{max-width:780px}
.about-panel p{white-space:pre-wrap;overflow-wrap:anywhere}
.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.watch-main{min-width:0}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;color:#fff}
.player>img{width:100%;height:100%;opacity:.85}
.player.playing>img{animation:slowpan 24s ease-in-out infinite alternate;opacity:.92}
.player-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0008;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;backdrop-filter:blur(3px)}
.player-center .icon{width:30px;height:30px;fill:#fff;stroke:#fff}
.playing .player-center{opacity:0}
.playing:hover .player-center,.playing:focus-within .player-center{opacity:1}
.player-caption{position:absolute;left:24px;top:20px;font-size:11px;letter-spacing:2px;opacity:.7}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:28px 12px 7px;background:linear-gradient(transparent,#000b)}
.player-controls input[type=range]{accent-color:var(--accent);height:4px;width:100%;cursor:pointer;margin:0}
.player-control-row{display:flex;align-items:center;gap:5px;font-size:12px}
.player-control-row .icon-btn{height:32px;width:32px}
.player-control-row .time{margin-left:4px;flex:1}
.player-control-row input.volume{width:56px;margin-left:3px}
.watch-title{font-size:22px;font-weight:700;line-height:1.35;margin:16px 0 13px;overflow-wrap:anywhere}
.watch-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.channel-byline{display:flex;gap:11px;align-items:center}
.channel-byline .btn{margin-left:9px}
.channel-byline h3{font-size:14px}
.reactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reaction-group{display:flex;background:var(--surface);border-radius:24px;overflow:hidden}
.reaction-group .btn{background:none;border-radius:0}
.reaction-group .btn+button{border-left:1px solid var(--border);padding:8px 12px}
.description{background:var(--surface);border-radius:12px;padding:14px;margin-top:18px}
.description p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:9px}
.description:not(.expanded) p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.text-btn{font-weight:600;padding:10px 0 0}
.comments{margin-top:26px}
.comments h3{margin-bottom:20px}
.comment-form{display:flex;gap:12px;margin:18px 0 24px}
.comment-form input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--border);background:var(--bg);color:var(--text-primary);padding:10px 0}
.comment{display:flex;gap:12px;margin:18px 0}
.comment p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.watch-aside .video-card{display:flex;gap:9px;margin:0 0 15px}
.watch-aside .thumb-link{width:160px;min-width:160px;height:90px;border-radius:9px}
.watch-aside .card-info{padding:0;gap:0;flex:1}
.watch-aside .card-info>a{display:none}
.watch-aside .card-title{font-size:13px;-webkit-line-clamp:2}
.watch-aside .card-more{width:18px}
.watch-aside .card-meta{font-size:11px}
.watch-aside h3{margin-bottom:14px}
.history-list{display:grid;gap:22px;max-width:1040px}
.history-list .video-card{display:flex;gap:20px}
.history-list .thumb-link{width:270px;min-width:270px}
.history-list .card-info{padding-top:6px;flex:1}
.history-list .card-title{font-size:18px}
.history-list .card-info>a{display:none}
.channel-result{display:flex;gap:20px;padding:18px 0;border-bottom:1px solid var(--border);align-items:center}
.channel-result .channel-copy{flex:1}
.channel-result p{margin:5px 0}
.search-heading{margin-bottom:14px}
.studio{background:var(--surface);min-height:100vh}
.studio .content{padding:90px 30px 40px}
.studio .sidebar,.studio .header{background:var(--bg)}
.studio .sidebar-item.active{color:var(--accent);background:var(--surface)}
.studio-page{max-width:1460px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:0}
.panel h2,.panel h3{margin-bottom:15px}
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--panel);border:1px solid var(--border);padding:19px 20px;border-radius:10px;min-width:0}
.stat-card label{display:block;color:var(--text-secondary);font-size:12px;margin-bottom:10px}
.stat-value{font-size:27px;letter-spacing:-.8px;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;animation:appear .2s}
.stat-card small{display:block;margin-top:10px;font-size:11px;color:var(--text-secondary)}
.dashboard-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
.feature-performance{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start}
.feature-performance .thumb-link{border-radius:8px}
.metric-list{display:grid;gap:12px}
.metric-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:0 0 10px}
.metric-line:last-child{border:0;padding:0}
.metric-line span{color:var(--text-secondary)}
.metric-line strong{font-weight:600}
.callout{border:1px solid var(--border);border-radius:10px;padding:18px;background:var(--surface);margin-top:20px}
.callout p{color:var(--text-secondary);margin:8px 0 14px}
.analytics-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}
.chart-wrap{position:relative}
.chart-svg{width:100%;height:245px;overflow:visible}
.chart-grid{stroke:var(--border);stroke-width:1}
.chart-label{fill:var(--text-secondary);font-size:11px}
.chart-tooltip{position:absolute;pointer-events:none;background:var(--text-primary);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:6px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-110%);z-index:5;display:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:86px;margin:24px 0 8px}
.bar{flex:1;min-width:0;background:var(--chart);border-radius:2px 2px 0 0;opacity:.8}
.bar:hover{opacity:1}
.realtime-dot{width:7px;height:7px;border-radius:50%;background:var(--chart);display:inline-block;margin-right:5px}
.rt-number{font-size:28px;margin-top:22px}
.top-video{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12px}
.top-video a{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:80%}
.traffic-list{display:grid;gap:16px}
.traffic-track{height:5px;border-radius:4px;background:var(--surface);margin-top:7px;overflow:hidden}
.traffic-fill{height:100%;background:var(--chart);border-radius:4px}
.below-analytics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.content-table{width:100%;border-collapse:collapse;font-size:12px}
.content-table th{text-align:left;color:var(--text-secondary);font-weight:500;padding:15px 12px;border-bottom:1px solid var(--border)}
.content-table td{padding:16px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.content-table tr:hover td{background:var(--surface)}
.table-video{display:flex;gap:14px;align-items:center;max-width:420px}
.table-video img{width:110px;height:62px;border-radius:6px;flex-shrink:0}
.table-video strong{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.table-video .row{margin-top:5px}
.table-video .icon-btn{width:28px;height:28px}
.table-panel{padding:0;overflow:hidden}
.badge{display:inline-flex;padding:4px 8px;background:var(--surface);border-radius:5px;white-space:nowrap;font-size:11px}
.badge.public{color:#168449}
.select{min-height:38px;border:1px solid var(--border);background:var(--panel);color:var(--text-primary);padding:7px 12px;border-radius:8px;max-width:100%}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px}
.field{display:grid;gap:7px;margin-bottom:18px;min-width:0}
.field label{font-size:12px;font-weight:600}
.input{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text-primary);padding:12px;min-width:0;resize:vertical}
.input:focus{border-color:var(--blue)}
textarea.input{min-height:115px}
.field small{font-size:11px;color:var(--text-secondary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.upload-preview{aspect-ratio:16/9;border:1px dashed var(--border);border-radius:10px;overflow:hidden;background:var(--surface);display:grid;place-items:center;margin-bottom:12px}
.upload-preview img{width:100%;height:100%}
.upload-label{display:inline-flex;gap:8px;cursor:pointer;align-items:center;justify-content:center;font-weight:600}
.file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.upload-label:focus-within{outline:2px solid var(--blue);outline-offset:3px}
.upload-tile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px;gap:10px}
.upload-tile .icon{width:32px;height:32px}
.preview-banner{height:145px;width:100%;object-fit:cover;border-radius:9px}
.image-setting{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:22px}
.image-setting .copy{flex:1}
.image-setting p{font-size:12px;color:var(--text-secondary);margin:7px 0 12px}
.customization{max-width:960px}
.customization .panel{margin-top:20px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 0;border-bottom:1px solid var(--border)}
.settings-row p{font-size:12px;color:var(--text-secondary);margin-top:5px}
.settings-row:last-child{border:0}
.dropdown{position:fixed;z-index:65;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:var(--shadow);width:256px;max-width:calc(100vw - 24px)}
.dropdown-item{width:100%;text-align:left;padding:11px 12px;border-radius:7px;display:flex;gap:12px;align-items:center;line-height:1.3;font-size:13px}
.dropdown-item:hover{background:var(--surface)}
.dropdown-heading{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.dropdown-heading p{font-size:12px;color:var(--text-secondary);margin-top:3px}
.modal-backdrop{position:fixed;inset:0;background:#0007;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.modal{max-width:860px;width:100%;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);animation:modalIn .18s ease}
.modal.small{max-width:480px}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:16px}
.modal-header h2{font-size:21px}
.modal-body{overflow-y:auto;padding:24px;overscroll-behavior:contain}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
.modal .form-grid{grid-template-columns:minmax(0,1fr) 260px}
.toast-container{position:fixed;bottom:24px;left:calc(var(--sidebar-width) + 24px);z-index:100;display:grid;gap:8px;pointer-events:none;max-width:calc(100vw - 48px)}
.toast{background:var(--text-primary);color:var(--bg);padding:13px 22px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;animation:appear .18s;pointer-events:auto}
.notice{padding:12px 16px;background:var(--surface);border-radius:9px;font-size:12px;color:var(--text-secondary);margin-bottom:18px}
.form-error{color:var(--accent);font-size:13px;margin-top:10px}
.progress{height:4px;background:var(--surface);overflow:hidden;border-radius:4px;margin-top:16px}
.progress span{display:block;height:100%;background:var(--blue);animation:progress 1.4s ease forwards}
.debug{position:fixed;bottom:15px;right:15px;background:#141d23;color:#85f4b3;padding:16px;z-index:60;border-radius:8px;white-space:pre;font:11px/1.8 monospace;max-width:calc(100vw - 30px)}

function simulateStep(from,to){const hours=(to-from)/3600e3;if(hours<=0)return;for(const v of state.videos){if(v.visibility!=='public'||v.publishedAt>to)continue;const c=channelBy(v.channelId),p=v.params,mid=(from+to)/2;let rate=rates(v,c,mid),hourIndex=Math.floor(to/3600e3);if(hourIndex!==p.lastSpikeHour){p.lastSpikeHour=hourIndex;const chance=.0007+p.recommendationScore*p.topicDemand*(1-p.competition)*.014;if(seeded(v.seed,hourIndex)<chance&&v.views>60&&mid-v.publishedAt<14*864e5){p.momentum=clamp(p.momentum+.2+p.recommendationScore*.35);if(c.id==='me'&&p.momentum>.45)notify('У «'+v.title+'» растёт интерес аудитории.','studio/video/'+v.id)}}p.momentum*=Math.exp(-hours/14);rate*=.92+seeded(v.seed,hourIndex+'rate')*.16;

function recommendations(exclude=null,category=activeCategory){const visible=state.videos.filter(v=>v.id!==exclude&&v.visibility==='public'&&!state.user.notInterested.includes(v.id)&&!state.user.blockedChannels.includes(v.channelId)&&(category==='Все'||v.category===category));const window=Math.floor(state.simulation.now/(3*3600e3));const scores=visible.map(v=>{const p=v.params,interest=state.user.interests[v.category]||.35,sub=state.subscriptions.includes(v.channelId)?.24:0,fresh=Math.exp(-(state.simulation.now-v.publishedAt)/(10*864e5)),explore=seeded(v.seed,'explore'+window)*.24,pop=clamp(Math.log10(1+v.views)/6);return{v,score:interest*.31+p.recommendationScore*.23+fresh*.12+pop*.09+p.momentum*.08+sub+explore-(state.history.some(h=>h.videoId===v.id)?.06:0)}});const result=[],counts={},channels={};while(scores.length&&result.length<48){scores.sort((a,b)=>(b.score-(counts[b.v.category]||0)*.055-(channels[b.v.channelId]||0)*.13)-(a.score-(counts[a.v.category]||0)*.055-(channels[a.v.channelId]||0)*.13));const v=scores.shift().v;result.push(v);counts[v.category]=(counts[v.category]||0)+1;channels[v.channelId]=(channels[v.channelId]||0)+1}return result}

function aggregate(vs,days=period){const out={views:0,watchSeconds:0,subscribersGained:0,impressions:0,likes:0,dislikes:0,comments:0};const cutoff=days===0?0:state.simulation.now-days*864e5;vs.forEach(v=>{if(days===0){Object.keys(out).forEach(k=>out[k]+=v[k]||0)}else v.history.filter(h=>h.timestamp+3600e3>=cutoff).forEach(h=>Object.keys(out).forEach(k=>out[k]+=h[k]||0))});out.ctr=out.impressions?out.views/out.impressions:0;out.retention=out.views?vs.reduce((n,v)=>n+v.views*v.params.retention,0)/Math.max(1,vs.reduce((n,v)=>n+v.views,0)):0;return out}
function series(vs,days=period,metric=chartMetric){const earliest=Math.min(state.simulation.now,...vs.map(v=>v.publishedAt)),actualDays=days||Math.max(1,Math.ceil((state.simulation.now-earliest)/864e5)+1),count=Math.min(actualDays,90),width=actualDays*864e5/count,end=Math.floor(state.simulation.now/864e5)*864e5+864e5,start=end-count*width;const points=Array.from({length:count},(_,i)=>({t:start+i*width,value:0}));vs.forEach(v=>v.history.forEach(h=>{const i=Math.floor((h.timestamp-start)/width);if(i>=0&&i<count)points[i].value+=h[metric]||0}));return points}
function statCards(stats,video=false){const values=[['Просмотры',stats.views,formatNumber,'views'],['Время просмотра',stats.watchSeconds/3600,n=>n.toLocaleString('ru-RU',{maximumFractionDigits:1})+' ч','watchSeconds'],[video?'Новые подписчики':'Подписчики',stats.subscribersGained,n=>'+'+formatNumber(n),'subscribersGained'],['Показы',stats.impressions,formatNumber,'impressions'],['CTR значков',stats.ctr,pct,'ctr']];return `<div class="stat-grid">${values.map(([label,value,format,key])=>`<button class="stat-card" data-action="chart-metric" data-metric="${key}" aria-label="График: ${label}" aria-pressed="${chartMetric===key}"${key===chartMetric?' style="border-color:var(--chart)"':''}><label>${label}</label><div class="stat-value" data-stat="${key}">${format(value)}</div><small>${period===0?'За всё время':'За выбранный период'}</small></button>`).join('')}</div>`}
function chart(vs){const points=series(vs).map(p=>({...p,value:chartMetric==='watchSeconds'?p.value/3600:p.value})),max=Math.max(1,...points.map(p=>p.value)),W=780,H=240,left=4,right=58,top=15,bottom=32,cw=W-left-right,ch=H-top-bottom;const coords=points.map((p,i)=>[left+(points.length===1?.5:i/(points.length-1))*cw,top+ch-p.value/max*ch]);let path=coords.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ');if(coords.length===1)path=`M${left} ${coords[0][1]} L${left+cw} ${coords[0][1]}`;const area=path+` L${left+cw} ${top+ch} L${left} ${top+ch} Z`;const lines=[0,.25,.5,.75,1].map(k=>{const y=top+ch-k*ch;return `<line x1="${left}" x2="${W-right}" y1="${y}" y2="${y}" class="chart-grid"/><text x="${W-right+8}" y="${y+4}" class="chart-label">${formatNumber(max*k)}</text>`}).join('');return `<div class="chart-wrap" data-chart="main"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="График статистики по времени"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart)" stop-opacity=".16"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>${lines}<path d="${area}" fill="url(#chartFill)"/><path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2.5"/>${[0,Math.floor((points.length-1)/2),points.length-1].filter((x,i,a)=>a.indexOf(x)===i).map(i=>`<text x="${coords[i][0]}" y="233" text-anchor="${i===0?'start':i===points.length-1?'end':'middle'}" class="chart-label">${new Date(points[i].t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</text>`).join('')}${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${points.length<10?4:2}" fill="var(--chart)"/><rect x="${Math.max(0,x-cw/Math.max(1,points.length-1)/2)}" y="0" width="${Math.max(12,cw/Math.max(1,points.length-1))}" height="225" fill="transparent" class="chart-hit" tabindex="0" data-value="${esc(chartMetric==='watchSeconds'?points[i].value.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ч':exact(points[i].value))}" data-date="${date(points[i].t)}" aria-label="${date(points[i].t)}: ${exact(points[i].value)}"/>`).join('')}</svg><div class="chart-tooltip" role="tooltip"></div></div>`}
function realtime(vs){const cutoff=state.simulation.now-48*3600e3,buckets=Array(48).fill(0);vs.forEach(v=>v.history.forEach(h=>{const i=Math.floor((h.timestamp-cutoff)/3600e3);if(i>=0&&i<48)buckets[i]+=h.views}));const total=buckets.reduce((a,b)=>a+b),max=Math.max(1,...buckets);const tops=vs.map(v=>({v,views:v.history.filter(h=>h.timestamp>=cutoff).reduce((s,h)=>s+h.views,0)})).sort((a,b)=>b.views-a.views).slice(0,3);return `<div class="panel realtime-panel"><h3>В реальном времени</h3><p class="tiny muted"><span class="realtime-dot"></span>Обновляется автоматически</p><div class="rt-number" data-rt-subs>${formatNumber(channelBy('me').subscribers)}</div><p class="tiny muted">Подписчиков на канале</p><hr class="divider"><strong data-rt-views>${exact(total)}</strong><span class="tiny muted"> просмотров · 48 часов</span><div class="bars">${buckets.map((n,i)=>`<div class="bar" style="height:${Math.max(2,n/max*100)}%" title="${48-i} ч назад: ${exact(n)} просмотров"></div>`).join('')}</div><div class="row between tiny muted"><span>48 ч назад</span><span>Сейчас</span></div><hr class="divider"><p class="tiny muted">Самые популярные видео</p>${tops.map(x=>`<div class="top-video"><a href="#/studio/video/${x.v.id}">${esc(x.v.title)}</a><strong>${exact(x.views)}</strong></div>`).join('')}${!vs.length?'<p class="tiny muted" style="margin-top:14px">Статистика появится после публикации.</p>':''}</div>`}
function traffic(vs){const sums=Array(6).fill(0);vs.forEach(v=>v.traffic.forEach((n,i)=>sums[i]+=n));const total=sums.reduce((a,b)=>a+b);return `<div class="panel"><h3>Источники трафика</h3><p class="chart-period-copy">Распределение просмотров за всё время</p><div class="traffic-list">${SOURCE_NAMES.map((s,i)=>`<div><div class="row between tiny"><span>${s}</span><strong>${total?pct(sums[i]/total):'0 %'}</strong></div><div class="traffic-track"><div class="traffic-fill" style="width:${total?sums[i]/total*100:0}%"></div></div></div>`).join('')}</div></div>`}
const periodSelect=()=>`<select class="select" id="period-select" aria-label="Период аналитики">${[[7,'Последние 7 дней'],[28,'Последние 28 дней'],[90,'Последние 90 дней'],[0,'Всё время']].map(([n,t])=>`<option value="${n}"${period===n?' selected':''}>${t}</option>`).join('')}</select>`;
function analytics(v=null){const vs=v?[v]:mine(),stats=aggregate(vs),label=chartMetric==='views'?'Просмотры':chartMetric==='watchSeconds'?'Время просмотра':chartMetric==='subscribersGained'?'Новые подписчики':'Показы';return `<div class="studio-page"><div class="section-head"><div>${v?`<a class="tiny muted" href="#/studio/content">← Контент канала</a>`:''}<h1>${v?'Аналитика видео':'Аналитика канала'}</h1>${v?`<p class="muted tiny" style="margin-top:5px">${esc(v.title)}</p>`:''}</div><div class="studio-actions">${v?btn('edit-video','Изменить','edit','outline',`data-id="${v.id}"`):''}${periodSelect()}</div></div>${statCards(stats,!!v)}<div class="analytics-layout"><div class="panel"><div class="row between" style="margin-bottom:8px"><h3>${label}</h3><span class="live">${state.simulation.speed?'Обновляется':'Приостановлено'}</span></div><p class="chart-period-copy">${period===0?'За всё время':'Последние '+period+' дней'} · ${v?phase(v):vs.length+' видео'}</p><div id="analytics-chart">${chart(vs)}</div>${!vs.length?`<div class="callout"><h3>Ваша история начинается здесь</h3><p>Опубликуйте первое видео, чтобы узнать, как его находит и смотрит аудитория.</p>${btn('create','Создать видео','create','primary')}</div>`:''}</div><div id="realtime-panel">${realtime(vs)}</div></div>${analyticsBottom(vs,v)}</div>`}
function analyticsBottom(vs,v){return `<div class="below-analytics" id="analytics-bottom">${traffic(vs)}<div class="panel"><h3>${v?'Вовлечение аудитории':'Популярные видео'}</h3><p class="chart-period-copy">За всё время</p>${v?`<div class="metric-list">${[['Средняя длительность просмотра',formatDuration(v.views?v.watchSeconds/v.views:0)],['Средний процент просмотра',pct(v.views?v.watchSeconds/v.views/v.duration:0)],['Нравится',exact(v.likes)],['Не нравится',exact(v.dislikes)],['Комментарии',exact(v.comments+v.localComments.length)],['Длительность видео',formatDuration(v.duration)],['Этап распространения',phase(v)]].map(([k,val])=>`<div class="metric-line"><span>${k}</span><strong>${val}</strong></div>`).join('')}</div>`:mine().sort((a,b)=>b.views-a.views).slice(0,5).map(v=>`<div class="top-video"><a href="#/studio/video/${v.id}">${esc(v.title)}</a><strong class="nowrap" data-cardcount="${v.id}">${formatNumber(v.views)}</strong></div>`).join('')||'<p class="muted">Здесь будут ваши самые популярные истории.</p>'}</div></div>`}
function speedSelect(){return `<select class="select" id="speed-select" aria-label="Скорость времени">${[[0,'Пауза'],[1,'1×'],[5,'5×'],[20,'20×']].map(([n,t])=>`<option value="${n}"${state.simulation.speed===n?' selected':''}>${t}</option>`).join('')}</select>`}
function dashboard(){const vs=mine(),c=channelBy('me'),all=aggregate(vs,0),recent=vs.reduce((n,v)=>n+v.history.filter(h=>h.timestamp>=state.simulation.now-48*3600e3).reduce((s,h)=>s+h.views,0),0),latest=vs[0],top=vs.slice().sort((a,b)=>b.views-a.views)[0];return `<div class="studio-page"><div class="section-head"><h1>Обзор канала</h1><div class="studio-actions"><span class="tiny muted">Темп обновлений</span>${speedSelect()}${btn('create','Создать','create','primary')}</div></div><div class="stat-grid">${[['Подписчики',c.subscribers],['Просмотры канала',all.views],['Опубликовано видео',vs.filter(v=>v.visibility==='public').length],['Просмотры за 48 часов',recent],['Время просмотра, ч',all.watchSeconds/3600]].map(([k,n],i)=>`<div class="stat-card"><label>${k}</label><div class="stat-value" data-dashboard="${i}">${i===4?n.toLocaleString('ru-RU',{maximumFractionDigits:1}):formatNumber(n)}</div><small>${i===2?'В открытом доступе':'Все данные вашего канала'}</small></div>`).join('')}</div><div class="dashboard-grid"><div class="panel"><h2>${latest?'Последнее видео':'Опубликуйте первое видео'}</h2>${latest?`<div class="feature-performance"><a class="thumb-link" href="#/watch/${latest.id}"><img class="thumbnail" src="${esc(thumbnail(latest))}" alt=""><span class="duration">${formatDuration(latest.duration)}</span></a><div><h3>${esc(latest.title)}</h3><p class="tiny muted" style="margin:8px 0 15px">${formatRelativeTime(latest.publishedAt)} · ${phase(latest)}</p><div class="metric-list"><div class="metric-line"><span>Просмотры</span><strong data-views="${latest.id}">${formatViews(latest.views)}</strong></div><div class="metric-line"><span>Показы</span><strong data-impressions="${latest.id}">${exact(latest.impressions)}</strong></div><div class="metric-line"><span>CTR</span><strong>${pct(latest.params.ctr)}</strong></div><div class="metric-line"><span>Средний просмотр</span><strong>${formatDuration(latest.duration*latest.params.retention)}</strong></div></div></div></div><div class="row wrap" style="margin-top:22px">${link('studio/video/'+latest.id,'Открыть аналитику','analytics')}${btn('edit-video','Изменить','edit','outline',`data-id="${latest.id}"`)}</div>`:`<div class="intro-art">${icon('upload')}</div><p class="muted" style="margin:20px 0">Поделитесь идеей, начните разговор или расскажите свою историю. Здесь вы увидите её первые результаты.</p>${btn('create','Создать видео','create','primary')}`}</div><div id="dashboard-realtime">${realtime(vs)}</div><div class="panel"><h2>Лучшее видео</h2>${top?`<div class="feature-performance"><a class="thumb-link" href="#/watch/${top.id}"><img class="thumbnail" src="${esc(thumbnail(top))}" alt=""></a><div><h3>${esc(top.title)}</h3><p class="muted" style="margin:10px 0">${formatViews(top.views)}</p>${link('studio/video/'+top.id,'Подробнее','analytics')}</div></div>`:'<p class="muted">После публикации здесь появится видео с наибольшим количеством просмотров.</p>'}</div><div class="intro-card"><div class="row">${icon('edit')}<strong>Канал с вашим характером</strong></div><h2>Первое впечатление имеет значение</h2><p class="muted" style="margin-bottom:20px">Добавьте обложку, выберите аватар и расскажите зрителям о своём канале.</p>${link('studio/customization','Настроить канал','edit','btn outline')}</div></div></div>`}
const visibilityLabel=v=>({public:'Открытый доступ',unlisted:'Доступ по ссылке',private:'Приватное'}[v]||v);
function contentPage(){const vs=mine();return `<div class="studio-page"><div class="section-head"><h1>Контент канала</h1>${btn('create','Создать видео','create','primary')}</div>${vs.length?`<div class="panel table-panel"><table class="content-table"><thead><tr><th>Видео</th><th>Видимость</th><th>Ограничения</th><th>Дата</th><th>Просмотры</th><th>Комментарии</th><th>Нравится</th></tr></thead><tbody>${vs.map(v=>`<tr data-video="${v.id}"><td><div class="table-video"><a href="#/studio/video/${v.id}"><img src="${esc(thumbnail(v))}" alt=""></a><div><a href="#/studio/video/${v.id}"><strong>${esc(v.title)}</strong></a><div class="row gap8">${ib('edit-video','Изменить видео','edit',`data-id="${v.id}"`)}<a class="icon-btn" href="#/studio/video/${v.id}" aria-label="Аналитика видео" title="Аналитика">${icon('analytics')}</a><a class="icon-btn" href="#/watch/${v.id}" aria-label="Смотреть видео" title="Смотреть">${icon('play')}</a>${ib('delete-video','Удалить видео','delete',`data-id="${v.id}"`)}</div></div></div></td><td data-label="Видимость"><span class="badge ${v.visibility}">${visibilityLabel(v.visibility)}</span></td><td data-label="Ограничения">Нет</td><td data-label="Дата">${date(v.publishedAt)}</td><td data-label="Просмотры" data-exactviews="${v.id}">${exact(v.views)}</td><td data-label="Комментарии" data-comments="${v.id}">${exact(v.comments+v.localComments.length)}</td><td data-label="Нравится" data-exactlikes="${v.id}">${exact(v.likes)}</td></tr>`).join('')}</tbody></table></div>`:empty('Расскажите свою первую историю','Достаточно обложки и идеи. Результаты публикации появятся здесь.',btn('create','Создать видео','create','primary'))}</div>`}
function imageInput(name,label,accept='image/*'){return `<label class="btn outline upload-label">${icon('upload')}${label}<input class="file-input" type="file" name="${name}" accept="${accept}" aria-label="${label}"></label>`}
function customization(){const c=channelBy('me');return `<div class="studio-page customization"><div class="section-head"><h1>Настройка канала</h1>${link('channel/me','Открыть канал','external','btn outline')}</div><form id="channel-form"><div class="panel"><h2>Оформление</h2><div class="image-setting"><div id="avatar-preview">${avatar(c,'large')}</div><div class="copy"><h3>Фото профиля</h3><p>Ваш образ рядом с видео и комментариями. Изображение будет сохранено в размере до 512 × 512.</p>${imageInput('avatar','Выбрать фото')}${c.avatar?btn('remove-image','Удалить','','outline','data-kind="avatar"'):''}</div></div><div class="stack"><div><h3>Баннер канала</h3><p class="tiny muted" style="margin:8px 0 14px">Широкое изображение в верхней части вашего канала.</p><img id="banner-preview" class="preview-banner" src="${esc(c.banner?safeImage(c.banner):art({seed:c.seed,artText:c.name,artKind:0},true))}" alt="Баннер канала"></div><div class="row wrap">${imageInput('banner','Выбрать баннер')}${c.banner?btn('remove-image','Удалить','','outline','data-kind="banner"'):''}</div></div></div><div class="panel"><h2>Основная информация</h2><div class="field"><label for="channel-name">Название канала</label><input class="input" id="channel-name" name="name" maxlength="80" value="${esc(c.name)}" required></div><div class="field"><label for="channel-handle">Псевдоним</label><input class="input" id="channel-handle" name="handle" maxlength="40" value="${esc(c.handle)}" pattern="@[A-Za-zА-Яа-яЁё0-9_.-]{3,39}" required><small>Начинается с @, минимум 3 буквы или цифры. Можно использовать точку, дефис и подчёркивание.</small></div><div class="field"><label for="channel-description">Описание</label><textarea class="input" id="channel-description" name="description" maxlength="3000" rows="5">${esc(c.description)}</textarea></div><div class="form-error" id="channel-error" role="alert"></div><div class="row between"><span class="tiny muted">Изменения сохраняются после нажатия кнопки</span><button class="btn primary" type="submit">Сохранить</button></div></div></form></div>`}
function settings(){return `<div class="studio-page customization"><div class="section-head"><h1>Настройки</h1></div><div class="panel"><h2>Ваше пространство</h2><div class="settings-row"><div><strong>Оформление</strong><p>Тема интерфейса сохраняется в браузере.</p></div><select class="select" id="theme-select" aria-label="Тема"><option value="light"${state.preferences.theme==='light'?' selected':''}>Светлая</option><option value="dark"${state.preferences.theme==='dark'?' selected':''}>Тёмная</option></select></div><div class="settings-row"><div><strong>Темп обновлений</strong><p>1×: одна секунда соответствует двум минутам времени платформы. Пауза останавливает и офлайн-прогресс.</p></div>${speedSelect()}</div><div class="settings-row"><div><strong>Рекомендации</strong><p>Очистить интересы и скрытые видео, сохранив подписки.</p></div>${btn('reset-interests','Сбросить','','outline')}</div><div class="settings-row"><div><strong>Резервная копия</strong><p>Сохраните канал и статистику в файл. Рекомендуется перед переносом в другой браузер.</p></div>${btn('export','Экспорт','upload','outline')}</div><div class="settings-row"><div><strong>Восстановление</strong><p>Загрузите ранее экспортированные данные.</p></div>${imageInput('import','Импорт','.json,application/json')}</div><div class="settings-row"><div><strong>Локальное хранилище</strong><p id="storage-size">${(JSON.stringify(state).length/1024).toLocaleString('ru-RU',{maximumFractionDigits:0})} КБ данных · ${state.videos.length} видео</p></div><span class="badge">${storageFailed?'Не сохранено':'Сохранено локально'}</span></div><div class="settings-row"><div><strong>Удалить все данные</strong><p>Канал, видео и история будут удалены из этого браузера.</p></div>${btn('reset','Сбросить','delete','outline danger')}</div></div></div>`}
// ROUTER
function readRoute(){let hashValue=location.hash.slice(2)||'home';let [path,query]=hashValue.split('?');try{path=decodeURIComponent(path)}catch{}return{path,query:new URLSearchParams(query||'')}}
function renderContent(){const {path,query}=readRoute();let html;if(path==='home')html=home();else if(path==='subscriptions')html=subscriptions();else if(path==='history'||path==='later')html=historyPage(path==='later');else if(path.startsWith('channel/'))html=channelPage(channelBy(path.slice(8)));else if(path.startsWith('watch/'))html=watchPage(videoBy(path.slice(6)));else if(path==='search')html=searchPage(query.get('q')||'');else if(path==='studio')html=dashboard();else if(path==='studio/content')html=contentPage();else if(path==='studio/analytics')html=analytics();else if(path.startsWith('studio/video/')){const v=videoBy(path.slice(13));html=v&&v.channelId==='me'?analytics(v):unavailable('Видео не найдено')}else if(path==='studio/customization')html=customization();else if(path==='settings')html=settings();else html=unavailable('Страница не найдена');$('#main').innerHTML=html;if(path==='studio/customization')editingImage={avatar:channelBy('me').avatar,banner:channelBy('me').banner,pending:0};if(path.startsWith('watch/'))updatePlayer();updateDebug()}
function render(){state.currentRoute=readRoute().path;shell(state.currentRoute.startsWith('studio'));renderContent()}
function routeChange(){closeDropdown();closeModal();const {path}=readRoute();if(path!==state.currentRoute){player.playing=false;player.time=0;player.videoId=null;channelTab='home'}if(path.startsWith('watch/')){const v=videoBy(path.slice(6));if(v){state.history=[{videoId:v.id,timestamp:state.simulation.now},...state.history.filter(h=>h.videoId!==v.id)].slice(0,CONFIG.historyLimit);interest(v,.045);player.videoId=v.id;player.viewRecorded=false}}const token=++renderGeneration;state.currentRoute=path;shell(path.startsWith('studio'));if(path==='home'||path==='subscriptions'){$('#main').innerHTML='<div class="video-grid">'+Array(6).fill('<div class="skeleton skeleton-card"></div>').join('')+'</div>';setTimeout(()=>{if(token===renderGeneration)renderContent()},130)}else renderContent();window.scrollTo(0,0);saveState()}
// MODALS / ASSETS
function closeDropdown(){ $('#dropdown-root').textContent=''; }
function dropdown(target,html){closeDropdown();const rect=target.getBoundingClientRect();const x=Math.max(12,Math.min(rect.right-256,innerWidth-268));const y=Math.min(rect.bottom+7,innerHeight-100);$('#dropdown-root').innerHTML=`<div class="dropdown" style="left:${x}px;top:${y}px" role="menu">${html}</div>`;requestAnimationFrame(()=>{const d=$('.dropdown');if(d){const r=d.getBoundingClientRect();if(r.bottom>innerHeight-14)d.style.top=Math.max(70,innerHeight-r.height-14)+'px'}})}

function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Не удалось прочитать файл.'));reader.readAsDataURL(file)})}
async function optimizeImage(file,kind){if(!file||!/^image\/(jpeg|png|webp|gif|bmp|avif)$/.test(file.type))throw Error('Выберите изображение JPG, PNG, WebP, GIF или AVIF.');if(file.size>30*1024*1024)throw Error('Размер изображения не должен превышать 30 МБ.');const data=await readFile(file),img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Этот формат изображения не удалось открыть.'));im.src=data});const [w,h]=kind==='avatar'?[512,512]:kind==='banner'?[1440,480]:[960,540];const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Браузер не поддерживает обработку изображений.');const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);ctx.fillStyle='#f0f0f0';ctx.fillRect(0,0,w,h);ctx.drawImage(img,(w-img.naturalWidth*scale)/2,(h-img.naturalHeight*scale)/2,img.naturalWidth*scale,img.naturalHeight*scale);let quality=.8,result=canvas.toDataURL('image/webp',quality);while(result.length>150000&&quality>.4){quality-=.1;result=canvas.toDataURL('image/webp',quality)}return result}
async function handleImage(input){const kind=input.name;if(kind==='import'){await importData(input.files[0]);return}const draft=kind==='thumbnail'?videoDraft:editingImage;if(!draft)return;draft.pending++;try{const image=await optimizeImage(input.files[0],kind);if((kind==='thumbnail'?videoDraft:editingImage)!==draft)return;draft[kind]=image;const preview=kind==='thumbnail'?$('#thumbnail-preview'):kind==='avatar'?$('#avatar-preview'):$('#banner-preview');if(preview){if(kind==='banner')preview.src=image;else preview.innerHTML=kind==='avatar'?`<span class="avatar large"><img src="${image}" alt="Фото профиля"></span>`:`<img src="${image}" alt="Превью видео">`}toast(kind==='thumbnail'?'Обложка готова':'Изображение готово. Сохраните изменения.')}catch(e){toast(e.message)}finally{draft.pending--}}
function parseDuration(s){const a=s.split(':').map(Number);if(a.length<2||a.length>3||a.some(n=>!Number.isFinite(n)||n<0)||a.at(-1)>59||a.length===3&&a[1]>59)return 0;return a.reduce((n,x)=>n*60+x,0)}

function deleteVideo(id){const v=videoBy(id);if(!v||v.channelId!=='me')return;state.videos=state.videos.filter(x=>x.id!==id);state.history=state.history.filter(x=>x.videoId!==id);state.user.watchLater=state.user.watchLater.filter(x=>x!==id);delete state.user.reactions[id];imageCache.clear();syncChannelTotals();saveState(true);closeModal();toast('Видео удалено');if(state.currentRoute.includes(id))location.hash='/studio/content';else render()}
function validateImport(data){if(data?.version!==1||!Array.isArray(data.channels)||!Array.isArray(data.videos)||!data.user||!data.preferences||!data.simulation||!Array.isArray(data.history)||!Array.isArray(data.subscriptions))throw Error('Файл не является резервной копией Кадра.');if(data.channels.length>1000||data.videos.length>3000)throw Error('Резервная копия слишком большая.');for(const c of data.channels){if(!c||typeof c.id!=='string'||!/^[-a-zA-Z0-9]+$/.test(c.id)||typeof c.name!=='string'||typeof c.handle!=='string'||!Number.isFinite(c.subscribers)||!Number.isFinite(c.seed)||typeof c.description!=='string')throw Error('Некорректные данные канала.')}if(!data.channels.some(c=>c.id==='me'))throw Error('В файле отсутствует ваш канал.');for(const v of data.videos){if(!v||typeof v.id!=='string'||!/^[-a-zA-Z0-9]+$/.test(v.id)||typeof v.title!=='string'||typeof v.description!=='string'||!CATEGORIES.includes(v.category)||!Array.isArray(v.tags)||!Array.isArray(v.history)||!v.params||!Array.isArray(v.traffic)||v.traffic.length!==6||!data.channels.some(c=>c.id===v.channelId))throw Error('Некорректные данные видео.');for(const k of ['views','impressions','likes','dislikes','comments','watchSeconds','duration','publishedAt','seed'])if(!Number.isFinite(v[k])||v[k]<0)throw Error('Некорректная статистика видео.');v.localComments??=[];for(const x of v.localComments)if(typeof x.text!=='string'||typeof x.author!=='string')throw Error('Некорректный комментарий.');for(const k of ['contentQuality','topicDemand','clickability','audienceFit','retentionPotential','engagementPotential','momentum','evergreenFactor','competition','recommendationScore','potential'])if(!Number.isFinite(v.params[k]))throw Error('Некорректные параметры видео.')}if(![0,1,5,20].includes(data.simulation.speed)||!Number.isFinite(data.simulation.now)||!Number.isFinite(data.simulation.lastSimulationTimestamp))throw Error('Некорректные настройки времени.');for(const k of ['watchLater','notInterested','blockedChanne async function importData(file){if(!file)return;if(file.size>8e6){toast('Размер резервной копии не должен превышать 8 МБ.');return}try{const data=validateImport(JSON.parse(await file.text()));openModal('Восстановить резервную копию?',`<p class="readable">Канал «${esc(data.userChannel.name)}» и ${data.videos.filter(v=>v.channelId==='me').length} видео заменят текущие данные. Перед восстановлением можно экспортировать текущую копию.</p>`,btn('export','Экспорт текущих данных','','outline')+btn('restore','Восстановить','','primary'),true);pendingImport=data}catch(e){toast(e.message||'Не удалось прочитать резервную копию.')}}

function recordWatch(v){if(player.viewRecorded)return;player.viewRecorded=true;v.views++;v.impressions++;v.watchSeconds+=v.duration*v.params.retention;v.traffic[3]++;if(v.channelId==='me')historyAdd(v,state.simulation.now,{views:1,impressions:1,watchSeconds:v.duration*v.params.retention});interest(v,.025);syncChannelTotals();saveState();updateLive()}

'reset-second'(){openModal('Последнее подтверждение',`<p class="readable">Введите <strong>УДАЛИТЬ</strong>, чтобы удалить все локальные данные Кадра и создать новое пространство.</p><div class="field" style="margin-top:18px"><input class="input" id="reset-word" aria-label="Введите УДАЛИТЬ" autocomplete="off"></div><div class="form-error" id="reset-error"></div>`,btn('close-modal','Отмена','','outline')+btn('reset-final','Удалить все данные','','primary'),true)},
'reset-final'(){if($('#reset-word').value.trim()!=='УДАЛИТЬ'){$('#reset-error').textContent='Введите слово УДАЛИТЬ.';return}clearTimeout(saveTimer);try{localStorage.removeItem(CONFIG.key)}catch{}state=freshState();imageCache.clear();syncChannelTotals();saveState(true);closeModal();setTheme(state.preferences.theme);if(location.hash==='#/home')render();else location.hash='/home';toast('Создано новое пространство')},
'submit-comment'(){}
};
function setTheme(theme){state.preferences.theme=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=state.preferences.theme;saveState()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const fn=actions[b.dataset.action];if(fn){if(b.type!=='submit')e.preventDefault();Promise.resolve(fn(b,e)).catch(error=>{console.error(error);toast('Не удалось выполнить действие. Попробуйте ещё раз.')})}}else if(!e.target.closest('.dropdown'))closeDropdown();if(e.target.classList.contains('modal-backdrop'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();const q=e.target.q.value.trim();if(q){activeCategory='Все';location.hash='/search?q='+encodeURIComponent(q);$('.header').classList.remove('search-open')}}else if(e.target.id==='video-form'){e.preventDefault();publish(e.target).catch(error=>{const m=$('.modal');if(m)m.dataset.busy='false';toast(error.message||'Не удалось опубликовать видео.');$$('button,input,textarea,select',m||document).forEach(x=>x.disabled=false)})}else if(e.target.id==='channel-form'){e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')).trim(),handle=String(data.get('handle')).trim();if(editingImage.pending){$('#channel-error').textContent='Дождитесь обработки изображений.';return}if(!name||!/^@[A-Za-zА-Яа-яЁё0-9_.-]{3,39}$/.test(handle)||state.channels.some(c=>c.id!=='me'&&c.handle.toLowerCase()===handle.toLowerCase())){$('#channel-error').textContent='Укажите название и уникальный псевдоним, начинающийся с @.';return}Object.assign(channelBy('me'),{name,handle,description:String(data.get('description')).trim(),avatar:editingImage.avatar,banner:editingImage.banner});saveState(true);render();toast('Изменения сохранены')}else if(e.target.id==='comment-form'){e.preventDefault();const v=videoBy(e.target.dataset.id),text=e.target.comment.value.trim();if(v&&text){v.localComments.unshift({id:uid('comment'),author:channelBy('me').name,text,at:state.simulation.now});v.localComments=v.localComments.slice(0,100);interest(v,.025);saveState();const time=player.time,playing=player.playing;renderContent();player.time=time;player.playing=playing;updatePlayer();toast('Комментарий добавлен')}}});
document.addEventListener('change',e=>{if(e.target.type==='file'){handleImage(e.target);return}if(e.target.id==='theme-select')setTheme(e.target.value);if(e.target.id==='speed-select'){settleTime();state.simulation.speed=Number(e.target.value);saveState(true);toast(state.simulation.speed?'Темп обновлений: '+state.simulation.speed+'×':'Обновления приостановлены')}if(e.target.id==='period-select'){period=Number(e.target.value);renderContent()}});
document.addEventListener('input',e=>{if(e.target.id==='timeline'){player.time=Number(e.target.value);updatePlayer()}if(e.target.classList.contains('volume')){player.volume=Number(e.target.value);updatePlayer()}});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.code==='KeyD'){e.preventDefault();debug=!debug;updateDebug()}if(e.key==='Escape'){closeDropdown();closeModal();$('#player')?.classList.remove('fullscreen-fallback');$('.header')?.classList.remove('search-open')}const modal=$('.modal');if(e.key==='Tab'&&modal){const items=$$('button:not(:disabled),input:not(:disabled):not([type=file]),textarea:not(:disabled),select:not(:disabled),a[href]',modal).filter(x=>x.offsetParent!==null);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.code==='Space'&&state.currentRoute.startsWith('watch/')&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)&&!modal){e.preventDefault();actions.play()}});
function showChartTooltip(el,x=null,y=null){const wrap=el.closest('.chart-wrap'),tip=$('.chart-tooltip',wrap),box=wrap.getBoundingClientRect(),hit=el.getBoundingClientRect();tip.textContent=el.dataset.date+' · '+el.dataset.value;tip.style.left=clamp(x===null?hit.left+hit.width/2-box.left:x-box.left,80,box.width-80)+'px';tip.style.top=(y===null?80:clamp(y-box.top,50,box.height-20))+'px';tip.style.display='block'}
document.addEventListener('pointermove',e=>{const hit=e.target.closest('.chart-hit');if(hit)showChartTooltip(hit,e.clientX,e.clientY);else $$('.chart-tooltip').forEach(x=>x.style.display='none')});document.addEventListener('focusin',e=>{if(e.target.classList.contains('chart-hit'))showChartTooltip(e.target)});document.addEventListener('pointerdown',e=>{if(e.target.classList.contains('chart-hit'))showChartTooltip(e.target,e.clientX,e.clientY)});
// Targeted updates preserve scroll, forms and playback.
let lastAnalyticsRender=0;
function updateLive(){const set=(selector,get)=>$$(selector).forEach(el=>{const text=get(el);if(el.textContent!==text)el.textContent=text});set('[data-views]',el=>formatViews(videoBy(el.dataset.views)?.views));set('[data-cardcount]',el=>formatNumber(videoBy(el.dataset.cardcount)?.views));set('[data-exactviews]',el=>exact(videoBy(el.dataset.exactviews)?.views));set('[data-likes]',el=>formatNumber(videoBy(el.dataset.likes)?.likes));set('[data-exactlikes]',el=>exact(videoBy(el.dataset.exactlikes)?.likes));set('[data-dislikes]',el=>formatNumber(videoBy(el.dataset.dislikes)?.dislikes));set('[data-comments]',el=>{const v=videoBy(el.dataset.comments);return exact((v?.comments||0)+(v?.localComments?.length||0))});set('[data-impressions]',el=>exact(videoBy(el.dataset.impressions)?.impressions));set('[data-subs]',el=>formatSubscribers(channelBy(el.dataset.subs)?.subscribers));set('[data-channelviews]',el=>exact(channelBy(el.dataset.channelviews)?.totalViews));const route=state.currentRoute;
if(route==='studio'){const vs=mine(),c=channelBy('me'),stats=aggregate(vs,0),recent=vs.reduce((n,v)=>n+v.history.filter(h=>h.timestamp>=state.simulation.now-48*3600e3).reduce((s,h)=>s+h.views,0),0),vals=[c.subscribers,stats.views,vs.filter(v=>v.visibility==='public').length,recent,stats.watchSeconds/3600];set('[data-dashboard]',el=>Number(el.dataset.dashboard)===4?vals[4].toLocaleString('ru-RU',{maximumFractionDigits:1}):formatNumber(vals[Number(el.dataset.dashboard)]))}
if((route==='studio/analytics'||route.startsWith('studio/video/'))&&!$('.modal')){const v=route.startsWith('studio/video/')?videoBy(route.slice(13)):null,vs=v?[v]:mine(),stats=aggregate(vs);set('[data-stat]',el=>{const key=el.dataset.stat;return key==='watchSeconds'?(stats[key]/3600).toLocaleString('ru-RU',{maximumFractionDigits:1})+' ч':key==='ctr'?pct(stats[key]):key==='subscribersGained'?'+'+formatNumber(stats[key]):formatNumber(stats[key])});if(Date.now()-lastAnalyticsRender>5000){lastAnalyticsRender=Date.now();const chartEl=$('#analytics-chart'),rt=$('#realtime-panel');if(chartEl)chartEl.innerHTML=chart(vs);if(rt)rt.innerHTML=realtime(vs);const bottom=$('#analytics-bottom');if(bottom)bottom.outerHTML=analyticsBottom(vs,v)}}if(route==='studio'&&Date.now()-lastAnalyticsRender>5000){lastAnalyticsRender=Date.now();const rt=$('#dashboard-realtime');if(rt)rt.innerHTML=realtime(mine())}updateDebug()}
function updateDebug(){if(!debug){$('#debug-root').textContent='';return}const v=videoBy(player.videoId)||mine()[0];$('#debug-root').textContent='';const el=document.createElement('div');el.className='debug';el.textContent='CLOCK '+new Date(state.simulation.now).toISOString()+'\nSPEED '+state.simulation.speed+'×\n'+(v?'VIDEO '+v.id+'\n'+['contentQuality','ctr','retention','recommendationScore','momentum','potential','velocity'].map(k=>k+': '+Number(v.params[k]).toFixed(4)).join('\n'):'No published videos');$('#debug-root').append(el)}
// APP INIT
state=loadState();const beforeViews=mine().reduce((n,v)=>n+v.views,0);settleTime();const offlineViews=mine().reduce((n,v)=>n+v.views,0)-beforeViews;syncChannelTotals();document.documentElement.dataset.theme=state.preferences.theme;window.addEventListener('hashchange',routeChange);routeChange();saveState(true);if(offlineViews>=1)setTimeout(()=>toast('Пока вас не было: +'+exact(offlineViews)+' просмотров'),400);
setInterval(()=>{if(document.visibilityState==='hidden')return;settleTime();updateLive();saveState()},2000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){settleTime();saveState(true);player.playing=false}else{settleTime();updateLive();updatePlayer();saveState()}});
window.addEventListener('pagehide',()=>{settleTime();saveState(true)});window.addEventListener('beforeunload',()=>{settleTime();saveState(true)});

})();
